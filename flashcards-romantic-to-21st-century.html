<main>
<h1>Flashcards: Romantic Era to the 21st Century</h1>
<p class="lead">Fine Arts Survey test review. Tap a card to flip it, then sort it: “I know it” or “Study again.”</p>

<div class="decks" id="decks" role="group" aria-label="Choose a deck"></div>

<div class="bar">
  <span id="pos">Card 1 of 0</span>
  <span class="tally">✓ <b class="k" id="nk">0</b> know it &nbsp; ↻ <b class="a" id="na">0</b> study again</span>
</div>
<div class="progress" aria-hidden="true"><span id="prog"></span></div>

<div id="study">
  <div class="stage">
    <button class="card" id="card" aria-live="polite">
      <div class="face front"><div class="label"><span class="dk"></span><span>Front</span></div><div class="txt" id="ftxt"></div><div class="hint">Tap or press Space to flip</div></div>
      <div class="face back"><div class="label"><span class="dk"></span><span>Back</span></div><div class="txt" id="btxt"></div></div>
    </button>
  </div>
  <div class="controls">
    <button class="nav" id="prev" aria-label="Previous card">←</button>
    <button class="again" id="again">↻ Study again</button>
    <button class="know" id="know">✓ I know it</button>
    <button class="nav" id="next" aria-label="Next card">→</button>
  </div>
</div>

<div class="done" id="done">
  <h2>Deck finished!</h2>
  <p id="donetxt"></p>
  <div class="row">
    <button id="redoAgain">Practice my “study again” cards</button>
    <button class="alt" id="redoAll">Start this deck over</button>
  </div>
</div>

<div class="tools">
  <button id="shuffle">Shuffle</button>
  <button id="reverse" aria-pressed="false">Show the answer side first</button>
  <button id="reset">Clear my progress</button>
</div>
<p class="keys">Keyboard: <kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>K</kbd> I know it · <kbd>A</kbd> study again</p>
</main>

const COLORS = {"Romantic: art, theater, dance":"#c0587a","Romantic: music":"#8a4fc4","Modernism":"#2f7fbf","Jazz and Broadway":"#d08a1c","Postmodernism":"#2f9a6a","21st century":"#3b8f9e","Big ideas and women":"#b5513a"};
const DECKS = ["All cards", ...Object.keys(COLORS)];
CARDS.forEach((c,i)=>c.id=i);
const KEY = "fas-flashcards-romantic-21st";
let st = {mark:{}};
try { st = JSON.parse(localStorage.getItem(KEY)) || st; if(!st.mark) st.mark={}; } catch(e){}
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
let deck = "All cards", order = [], pos = 0, reverse = false, onlyAgain = false;
const $ = id=>document.getElementById(id);

function build(){
  let list = CARDS.filter(c=>deck==="All cards"||c.d===deck);
  if (onlyAgain) list = list.filter(c=>st.mark[c.id]==="a");
  order = list.map(c=>c.id); pos = 0;
}
function counts(){
  const ids = CARDS.filter(c=>deck==="All cards"||c.d===deck).map(c=>c.id);
  let k=0,a=0; ids.forEach(i=>{ if(st.mark[i]==="k")k++; else if(st.mark[i]==="a")a++; });
  return {k,a,total:ids.length};
}
function render(){
  const {k,a,total} = counts();
  $("nk").textContent=k; $("na").textContent=a;
  $("prog").style.width = (total? (k+a)/total*100 : 0)+"%";
  document.querySelectorAll(".deck").forEach(b=>b.setAttribute("aria-pressed", b.dataset.d===deck));
  if (pos >= order.length){
    $("study").style.display="none"; $("done").style.display="block";
    $("pos").textContent = order.length+" of "+order.length;
    $("donetxt").textContent = a ? `You know ${k} of ${total} cards. ${a} ${a===1?"card needs":"cards need"} more practice.` : `You know all ${total} cards in this deck. Great work!`;
    $("redoAgain").style.display = a ? "" : "none";
    return;
  }
  $("study").style.display=""; $("done").style.display="none";
  const c = CARDS[order[pos]];
  const card = $("card"); card.classList.remove("flipped");
  card.style.setProperty("--deck", COLORS[c.d]);
  card.querySelectorAll(".face").forEach(f=>f.style.setProperty("--deck", COLORS[c.d]));
  card.querySelectorAll(".dk").forEach(s=>s.textContent=c.d);
  $("ftxt").innerHTML = reverse ? c.b : c.f;
  $("btxt").innerHTML = reverse ? c.f : c.b;
  card.querySelector(".front .txt").style.fontFamily = reverse ? "inherit" : "";
  card.querySelector(".front .txt").style.fontSize = reverse ? "clamp(1.05rem,3.6vw,1.25rem)" : "";
  card.querySelector(".back .txt").style.fontFamily = reverse ? "Fraunces,Georgia,serif" : "";
  card.querySelector(".back .txt").style.fontSize = reverse ? "clamp(1.45rem,5vw,2.05rem)" : "";
  $("pos").textContent = `Card ${pos+1} of ${order.length}` + (onlyAgain?" (study again)":"");
  $("card").setAttribute("aria-label", "Card "+(pos+1)+". Press to flip.");
}
function flip(){ $("card").classList.toggle("flipped"); }
function mark(v){ if(pos>=order.length)return; st.mark[order[pos]]=v; save(); pos++; render(); }
function shuffle(){ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} pos=0; render(); }

DECKS.forEach(d=>{
  const b=document.createElement("button"); b.className="deck"; b.dataset.d=d;
  const n = d==="All cards"?CARDS.length:CARDS.filter(c=>c.d===d).length;
  b.textContent = `${d} (${n})`;
  b.onclick=()=>{ deck=d; onlyAgain=false; build(); render(); };
  $("decks").appendChild(b);
});
$("card").onclick=flip;
$("know").onclick=()=>mark("k");
$("again").onclick=()=>mark("a");
$("next").onclick=()=>{ if(pos<order.length-1){pos++;render();} };
$("prev").onclick=()=>{ if(pos>0){pos--;render();} };
$("shuffle").onclick=shuffle;
$("reverse").onclick=function(){ reverse=!reverse; this.setAttribute("aria-pressed",reverse); this.textContent = reverse?"Show the term side first":"Show the answer side first"; render(); };
$("reset").onclick=()=>{ if(confirm("Clear all your “I know it” and “study again” marks?")){ st={mark:{}}; save(); onlyAgain=false; build(); render(); } };
$("redoAgain").onclick=()=>{ onlyAgain=true; build(); shuffle(); };
$("redoAll").onclick=()=>{ const ids=CARDS.filter(c=>deck==="All cards"||c.d===deck).map(c=>c.id); ids.forEach(i=>delete st.mark[i]); save(); onlyAgain=false; build(); render(); };
document.addEventListener("keydown",e=>{
  if(e.target.closest && e.target.closest(".tools,.decks,.done")) return;
  if(e.key===" "){ if(e.target.tagName==="BUTTON") return; e.preventDefault(); if(pos<order.length) flip(); }
  else if(e.key==="ArrowRight") $("next").click();
  else if(e.key==="ArrowLeft") $("prev").click();
  else if(e.key.toLowerCase()==="k") mark("k");
  else if(e.key.toLowerCase()==="a") mark("a");
});
build(); render();
</script>
