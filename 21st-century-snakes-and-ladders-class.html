<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>21st-Century Arts: Snakes and Ladders: Team Edition</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bungee&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--bg:#eef0fa;--surface:#ffffff;--ink:#1c1f3b;--muted:#545a7a;--line:#cfd4ea;--night:#262a66;--deep:#1a1d4d;--butter:#ffe6a1;--mint:#bceae5;--peach:#ffcdb9;--sky:#cad7ff;--pink:#d92f73;--gold:#ffc23d;--snake:#2c9c57;--spot:#a6e36f;--wood:#c9772f;--accent:#3b3fa8;--ok:#1f7a45;--ok-soft:#d8f2e2;--red:#b3263c;--red-soft:#f8dde2;--hl:#fff176;
--display:"Bungee","Arial Black","Trebuchet MS",sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11132e;--surface:#1c1f42;--ink:#e8eaf8;--muted:#a9aecb;--line:#343869;--accent:#a9adff;--ok:#7fd6a0;--ok-soft:#1d3a2c;--red:#ff8a9c;--red-soft:#4a1c26}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11132e;--surface:#1c1f42;--ink:#e8eaf8;--muted:#a9aecb;--line:#343869;--accent:#a9adff;--ok:#7fd6a0;--ok-soft:#1d3a2c;--red:#ff8a9c;--red-soft:#4a1c26}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18.5px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.15}
h2{font-size:clamp(24px,3.8vw,34px);margin:.2em 0 .5em;color:var(--accent)}
h3{font-size:21px;color:var(--accent);margin:1.2em 0 .4em}
h4{font-size:18px;margin:.2em 0 .5em}
a{color:var(--pink)}
p{margin:.7em 0}
.sm{font-size:15.5px;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:var(--deep);color:#e8eaf8;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.topbar .in{max-width:940px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;font-size:15px}
.topbar .t{font-family:var(--display);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .pbar{flex:1;height:10px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;min-width:60px}
.topbar .pbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,#ffd877 10px 12px);transition:width .5s}
.topbar .pct{white-space:nowrap;font-weight:700}
.teacherbar{background:var(--gold);color:#1c1f3b;font-size:15px;padding:8px 18px;text-align:center;font-weight:700}
.teacherbar a{color:#1c1f3b}
/* stage */
.wrap2{max-width:940px;margin:0 auto;padding:64px 10px 30px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--night);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;border:5px solid var(--deep);box-shadow:0 10px 28px rgba(20,22,60,.35);color:#eceefb}
.hud{position:relative;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:rgba(0,0,0,.25);border-bottom:2px solid rgba(255,255,255,.08)}
.slots{display:flex;gap:4px;flex-wrap:wrap}
.slot{width:32px;height:34px;border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.35);font-size:15px}
.slot.got{border:2px solid var(--gold);background:var(--pink);font-family:var(--display);font-size:18px;color:#fff}
.hud .sp{flex:1}
.hbtn{font:700 15px var(--body);background:rgba(255,255,255,.08);color:#eceefb;border:1.5px solid rgba(255,255,255,.28);border-radius:6px;padding:5px 11px;cursor:pointer}
.hbtn:hover{background:rgba(255,194,61,.22)}
#screen{position:relative;z-index:1;min-height:520px;padding:22px 20px 26px}
#screen.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#screen.center .lede{max-width:640px}
#screen h2{color:var(--gold)}
.stage .wipe{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(26,29,77,.96) 0 6px,rgba(38,42,102,.96) 6px 12px);transform:scaleY(0);transform-origin:top;transition:transform .3s ease-in}
.stage.closing .wipe{transform:scaleY(1)}
.big{font-size:clamp(40px,8.5vw,84px);color:#fff;margin:.05em 0;line-height:.95;display:flex;flex-direction:column;align-items:center}
.big span:first-child{color:var(--spot);text-shadow:0 5px 0 var(--snake)}
.big span:last-child{color:var(--gold);text-shadow:0 5px 0 var(--wood)}
.big .amp{font-size:.45em;color:var(--pink);text-shadow:none;margin:.1em 0}
.tagline{font-family:var(--display);letter-spacing:.04em;color:#c9cdf5;margin:.3em 0 0;font-size:18px}
.lede{font-size:20px}
.date{color:#c9cdf5;margin:0;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.btn{font:700 16px var(--body);padding:8px 16px;border-radius:6px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn:hover{background:rgba(59,63,168,.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.btn.wrong{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1c1f3b;font-family:var(--display);font-weight:400;font-size:17px;padding:10px 22px;box-shadow:0 4px 0 #b9821a}
.btn.gold:hover{background:#ffd264}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff;font-family:var(--display);font-weight:400;font-size:17px;padding:10px 22px;box-shadow:0 4px 0 #8f1748}
.btn.ghost{border-color:rgba(255,255,255,.55);color:#eceefb}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.ghost2{border-color:var(--line);color:var(--muted);font-size:14px}
/* speaker */
.speaker{display:flex;gap:16px;align-items:center;text-align:left;max-width:660px;margin:12px auto 0}
.speaker svg{flex:0 0 112px;width:112px;height:124px}
.bubble{background:#fffdf3;color:#1c1f3b;border-radius:10px;padding:14px 18px;font-size:18.5px;position:relative;border:3px solid var(--deep);box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.bubble .who{font-family:var(--display);color:var(--pink);font-size:14px;display:block}
@media (max-width:600px){.speaker{flex-direction:column;text-align:center}.speaker svg{flex-basis:auto;width:90px;height:100px}}
.how{text-align:left;max-width:660px;margin:14px auto;background:rgba(0,0,0,.22);border-radius:10px;padding:12px 18px 12px 38px}
.how li{margin:.35em 0}
.how mark{color:#1c1f3b}
/* tokens */
.tokpick{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.tok{font:inherit;background:#fffdf3;color:#1c1f3b;border:3px solid var(--deep);border-radius:10px;padding:10px 16px;cursor:pointer;min-width:122px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 var(--deep)}
.tok .e{font-size:44px;line-height:1.1}
.tok b{font-family:var(--display);font-weight:400;font-size:16px}
.tok:hover{border-color:var(--gold);box-shadow:0 4px 0 var(--deep),0 0 0 4px rgba(255,194,61,.45)}
/* board */
#screen.boardscr{padding:16px 14px 22px}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:start}
@media (max-width:760px){.bwrap{grid-template-columns:1fr}}
.board{background:var(--deep);border-radius:10px;padding:8px;border:3px solid #10123a;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.grid{position:relative;display:grid;gap:3px}
.cell{position:relative;border-radius:4px;background:var(--butter);color:#2a2c55;border:0;padding:0;font:inherit;display:block;min-height:0}
.cell.c0{background:var(--butter)}.cell.c1{background:var(--mint)}.cell.c2{background:var(--peach)}.cell.c3{background:var(--sky)}
.cell .n{position:absolute;left:3px;top:1px;font-size:clamp(9px,1.4vw,12.5px);font-weight:700;opacity:.7}
.cell.special,.cell.finish{z-index:3}
.cell.special{background:var(--pink);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 3px var(--gold)}
.cell.special .n{opacity:.9}
.cell.special .si{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(15px,2.6vw,26px)}
.cell.special.done{background:#7a2a86}
.cell.special.done .si{font-family:var(--display);color:var(--gold);font-size:clamp(17px,2.8vw,28px)}
.cell.finish{background:repeating-conic-gradient(#fff 0 25%,#1c1f3b 0 50%) 0 0/14px 14px;box-shadow:inset 0 0 0 3px var(--gold)}
.cell.finish .n{background:var(--gold);color:#1c1f3b;border-radius:3px;padding:0 3px;opacity:1}
.cell.finish .si{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(15px,2.6vw,26px)}
.cell .toks{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(18px,3.2vw,30px);line-height:1}
.cell:has(.me){z-index:4}
.cell .toks span.me{filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 3px 2px rgba(0,0,0,.5));animation:bob 1.4s ease-in-out infinite}
.toks span.me.pop{animation:pop .5s ease-out}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible;opacity:.95}
.ladder{filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.ladder .rail{stroke:var(--wood);stroke-width:9;stroke-linecap:round}
.ladder .rung{stroke:#e59a55;stroke-width:6;stroke-linecap:round}
.snake .body{fill:none;stroke:var(--snake);stroke-width:20;stroke-linecap:round;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.snake .spots{fill:none;stroke:var(--spot);stroke-width:8;stroke-linecap:butt;stroke-dasharray:8 14}
.snake .head{fill:var(--snake);stroke:#14532d;stroke-width:3}
.snake .eye{fill:#fff;stroke:#1c1f3b;stroke-width:2}
.snake .tongue{fill:none;stroke:#e02e4d;stroke-width:3.5;stroke-linecap:square}
.startpad{margin-top:6px;border-radius:4px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;gap:10px;padding:4px 10px;min-height:40px;position:relative}
.startpad .si{font-family:var(--display);color:var(--gold);font-size:15px}
.startpad .toks{position:static;display:flex;font-size:26px}
.side{background:rgba(0,0,0,.26);border-radius:10px;padding:12px 14px}
.die{width:82px;height:82px;margin:4px auto 8px;border-radius:12px;background:#fffdf3;border:3px solid var(--deep);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;box-shadow:0 5px 0 #10123a}
.die i{width:13px;height:13px;border-radius:2px;background:var(--pink);place-self:center;visibility:hidden}
.die.roll{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-14deg) scale(1.05)}50%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
.side .btn{width:100%;margin:4px 0}
.next{font-size:16px;margin:8px 0;background:rgba(255,255,255,.07);border-radius:6px;padding:8px 10px}
.next b{color:var(--gold)}
.stats{font-size:15px;line-height:1.55;margin:8px 0;color:#d4d7f6}
.stats b{color:var(--gold)}
.log{font-size:14.5px;line-height:1.4;max-height:160px;overflow:auto;margin:8px 0 0;padding:0;list-style:none}
.log li{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.15)}
@media (max-width:760px){.side{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;align-items:start}.side .die{grid-row:span 3;margin:0}.side .log{grid-column:1/-1}}
/* hazard */
.claim{font-size:clamp(20px,3vw,25px);font-weight:700;background:#fffdf3;color:#1c1f3b;border-radius:8px;padding:12px 18px;max-width:620px;border-left:8px solid var(--gold);margin:16px auto 0}
.answers.two{flex-direction:row;justify-content:center;max-width:460px}
.answers.two .ans{flex:1;text-align:center;font-family:var(--display);font-weight:400}
/* notes */
#screen.notes{padding:14px 10px 20px}
.program{background:var(--surface);color:var(--ink);border-radius:10px;padding:16px 26px 22px;max-width:780px;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.25);border:2px solid var(--line);text-align:left}
@media (max-width:600px){.program{padding:12px 14px 18px}}
.program h2{color:var(--accent)!important}
.ptop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted);border-bottom:2px dotted var(--line);padding-bottom:6px;margin-bottom:6px}
.bigicon{font-size:58px;line-height:1}
.endmark{height:2px}
.listen,.conn,.explorer,.discuss,.tryit,.lab{border-radius:8px;padding:12px 16px;margin:18px 0}
.lh{font-family:var(--display);font-size:16.5px;margin:0 0 4px;color:var(--accent)}
.listen{background:rgba(59,63,168,.07);border:1px solid var(--accent)}
.listen .who{font-size:15px;color:var(--muted)}
.listen .lf{margin:.4em 0 0;font-weight:700;font-size:16px}
.listen ul{margin:.2em 0 .2em 1.1em;padding:0;font-size:17px}
.listen .heard{margin-top:6px}
.listen .heard.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.conn{background:rgba(255,194,61,.15);border-left:6px solid var(--gold)}
.conn p:last-child{margin-bottom:0}
.explorer{background:var(--bg);border:1px solid var(--line)}
.explorer .card{display:none}.explorer .card.on{display:block}
.explorer .card h4{color:var(--pink);font-size:22px}
.exnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.exnav .count{font-size:15px;color:var(--muted)}
.discuss{background:var(--bg);border:1px dashed var(--muted)}
.discuss p{margin:0 0 6px;font-weight:700}
.discuss textarea{width:100%;font:inherit;font-size:17px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lab{background:rgba(44,156,87,.08);border:2px solid var(--snake)}
.lab .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.lab .btn[aria-pressed="true"]{background:var(--accent);color:#fff}
.lab .out{min-height:1.3em}
.singin{font:inherit;padding:7px 12px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:min(260px,100%)}
.beatgrid{display:grid;grid-template-columns:64px repeat(8,minmax(0,1fr));gap:5px;align-items:center;max-width:520px;margin:8px 0}
.beatgrid .bl{font-size:14px;font-weight:700}
.pad{aspect-ratio:1;border-radius:4px;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:0}
.pad:nth-of-type(4n+1){border-color:var(--muted)}
.pad.on{background:var(--pink);border-color:var(--pink)}
.pad.now{outline:3px solid var(--gold);outline-offset:1px}
/* try it */
.tryit{background:var(--bg);border:2px solid var(--pink)}
.tryit ol{padding-left:1.2em;margin:6px 0}
.tryit li{margin:12px 0}
.tryit .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tryit li.ok .txt::after{content:" ✓";color:var(--ok);font-weight:700}
.tryit .tfb{font-weight:700;color:var(--pink);min-height:1.2em}
.tryit[data-mode="keys"] .opts .btn{border-radius:6px;min-width:64px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;padding:7px 14px}
.tryit[data-mode="keys"] .opts .btn:hover:not(:disabled){border-color:var(--accent)}
.tryit[data-mode="keys"] .opts .btn.right{background:var(--ok-soft);border-color:var(--ok)}
.tryit[data-mode="keys"] .opts .btn.wrong{background:var(--red-soft);border-color:var(--red)}
.gate{margin-top:24px;border-radius:8px;border:2px solid var(--line);padding:14px 18px;background:var(--bg)}
.gate .lbl{font-family:var(--display);font-size:17px;color:var(--accent);margin:0 0 6px}
.gate .gl{margin:4px 0;font-size:17px}
.gate .ck{display:inline-block;width:1.3em;font-weight:700}
.gate .ck.yes{color:var(--ok)}
.gate .letter{font-family:var(--display);font-size:30px;color:var(--pink);padding:0 6px}
.meter{height:10px;border-radius:2px;background:var(--line);overflow:hidden;margin:8px 0}
.meter span{display:block;height:100%;background:var(--pink);width:0}
mark,.missed{background:var(--hl)!important;color:#1c1f3b!important;box-shadow:0 0 0 4px var(--hl);border-radius:3px}
.missed *{color:#1c1f3b!important}
.reviewed{transition:background 2s;background:var(--ok-soft)}
/* challenge */
.progress{font-size:15px;color:#c9cdf5;margin:0}
.pips{display:flex;gap:6px;justify-content:center;margin:8px 0}
.pip{width:14px;height:14px;border-radius:2px;border:2px solid var(--gold)}
.pip.on{background:var(--gold)}
.answers{display:flex;flex-direction:column;gap:10px;width:100%;max-width:580px;margin:16px auto 0}
.ans{font:700 18px var(--body);text-align:left;padding:12px 16px;border-radius:8px;border:3px solid var(--deep);background:#fffdf3;color:#1c1f3b;cursor:pointer;box-shadow:0 4px 0 #10123a}
.ans:hover:not(:disabled){background:#fff1c4}
.ans.right{background:#cfeedb;border-color:#1f7a45}
.ans.wrong{background:#f8dde2;border-color:#b3263c}
.ans:disabled{cursor:default}
.letter{font-family:var(--display);font-size:44px;color:var(--gold);padding:0 8px}
.feedback{min-height:1.3em;font-weight:700;color:#ffe3a3;max-width:620px}
/* table */
.tablewrap{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:520px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
/* finale */
.bossrow{display:flex;gap:14px;align-items:center;max-width:660px;text-align:left}
.bossrow svg{flex:0 0 130px;width:130px;height:144px}
@media (max-width:600px){.bossrow{flex-direction:column;text-align:center}}
.code{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.code span{width:38px;height:46px;border-radius:4px;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:24px;color:#fff;background:var(--pink)}
.pwf{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pwf input{font:700 20px var(--body);padding:8px 14px;border-radius:6px;border:3px solid var(--gold);background:#fffdf3;color:#1c1f3b;letter-spacing:.12em;width:220px}
.pwf input::placeholder{letter-spacing:0;color:#6b6e8a}
/* words */
.wsearch{width:100%;font:inherit;padding:8px 12px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin:6px 0 10px}
dl.words{margin:0}
dl.words > div{padding:6px 0;border-bottom:1px solid var(--line)}
dl.words dt{font-weight:700;color:var(--accent)}
dl.words dd{margin:0}
/* submit form */
.form{display:flex;gap:12px;flex-wrap:wrap}
.form label{display:flex;flex-direction:column;font-weight:700;font-size:16px;flex:1;min-width:180px}
.form input{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#stOut{width:100%;min-height:200px;font:14px/1.4 Consolas,monospace;margin-top:8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.program .btns{justify-content:flex-start}
/* modal, pill, footer */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,12,40,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}

<div class="topbar"><div class="in"><span class="t">Snakes &amp; Ladders: The Digital Stage · Team Edition</span></div></div>
<div class="wrap2" style="max-width:1200px"><div class="stage" id="stage"><div id="screen" aria-live="polite"></div></div></div>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true"></div>
<template id="tpl-digital">
<p id="dig-1">In the 1980s and 1990s, people bought music on records, cassettes, and CDs, and they watched music videos on MTV, which began in 1981. Then the 21st century arrived, and the technology changed fast. In 2001 the iPod promised “1,000 songs in your pocket.” <b>YouTube</b> opened in 2005, the first <b>iPhone</b> arrived in 2007, and <b>Spotify</b> began <b>streaming</b> music in 2008. Streaming means playing music or video straight from the internet instead of owning a copy.</p>
<p id="dig-2">Art made by living artists in our own time is called <b>contemporary art</b>. Like the postmodernists you met in the last lesson, contemporary artists use many styles at once. What is new is how much of their work depends on technology: computers, phones, the internet, projectors, and even <b>artificial intelligence</b>.</p>
<p id="dig-3">Technology plays three roles in 21st-century art. It is a <b>tool</b> for making art: one laptop can be a whole recording studio. It is a <b>stage</b> for sharing art: a song can go viral online before any radio station plays it. And it raises new <b>questions</b>: If a computer helps make a song, who is the artist? If anyone can copy a file, who owns it?</p>
<p id="dig-5">Technology also decides what you hear next. Streaming apps use <b>algorithms</b>, step-by-step computer rules, to recommend songs based on what you and people like you have played and skipped. In 2018 the writer Liz Pelly found that Spotify’s recommendations repeated the gender bias of its most popular playlists, such as RapCaviar, which featured mostly men. The money is uneven too: one industry report found that in 2013 the most popular 1% of recordings earned 84% of all streaming and subscription money.</p>
<p id="dig-4">In this game, music comes first, but every square also connects music to visual art, theater, or dance. Watch for the 🔗 connection boxes.</p>
<div class="conn" id="dig-6"><p class="lh">🔗 Connection: visual art</p><p>Contemporary art is not all screens and software. The Vietnamese artist <b>Tuan Andrew Nguyen</b>, born in Saigon in 1976, makes films and sculptures together with Vietnamese communities around the world, including communities in <b>Louisiana</b>, to tell stories of colonization, war, and migration that official histories left out. The PBS series <i>Art in the Twenty-First Century</i> (made by Art21) follows him in its 2025 episode “Between Worlds.”</p><p class="seeart">🖼️ <a href="https://art21.org/watch/art-in-the-twenty-first-century/s12/tuan-andrew-nguyen-in-between-worlds/" target="_blank" rel="noopener">See Tuan Andrew Nguyen’s films and sculptures on Art21</a> <span class="sm">(optional video, about 15 minutes, for later)</span></p></div>
<div class="explorer" data-k="timeline"><p class="lh">🔍 Click through a timeline of the digital age</p><div class="cards">
<div class="card"><h4>2001</h4><p>Apple’s iPod goes on sale. Wikipedia also begins.</p></div>
<div class="card"><h4>2004</h4><p>GarageBand, free music-making software, comes on Apple computers.</p></div>
<div class="card"><h4>2005</h4><p>YouTube opens. Anyone can now post a video for the whole world.</p></div>
<div class="card"><h4>2007</h4><p>The first iPhone arrives, and Hatsune Miku, a singing computer voice, is released in Japan.</p></div>
<div class="card"><h4>2008</h4><p>Spotify starts streaming music.</p></div>
<div class="card"><h4>2010</h4><p>Eric Whitacre’s first Virtual Choir joins 185 singers who never met. The iPad comes out.</p></div>
<div class="card"><h4>2015</h4><p>Lin-Manuel Miranda’s hip-hop musical <i>Hamilton</i> opens on Broadway.</p></div>
<div class="card"><h4>2018</h4><p>teamLab Borderless, a museum of moving digital art, opens in Tokyo.</p></div>
<div class="card"><h4>2018</h4><p>Eight of the ten most-watched music videos on YouTube are in Spanish.</p></div>

<div class="card"><h4>2022</h4><p>AI tools that make pictures and writing from a typed request become available to the public.</p></div>
<div class="card"><h4>2023</h4><p>“Heart on My Sleeve,” a song with fake AI voices of Drake and the Weeknd, goes viral and is pulled from streaming services.</p></div>

<template id="tpl-studio">
<p id="stu-1">For most of the 20th century, making a professional record meant renting an expensive studio full of machines, with engineers to run them. Today a laptop can do the same job. A <b>digital audio workstation</b>, or <b>DAW</b>, is software for recording, editing, and mixing music. GarageBand (2004), Ableton Live, and FL Studio are popular DAWs.</p>
<p id="stu-2">A DAW lets a musician record one <b>track</b> at a time and stack the tracks in layers, copy and paste a part, fix a wrong note, or build a beat from short repeating patterns called <b>loops</b>. A <b>MIDI controller</b>, such as a small keyboard or a set of pads, sends notes to the computer using MIDI, a computer language for music invented in 1983. That means one small keyboard can play the sound of a piano, a string orchestra, or a drum kit.</p>
<div class="lab beat"><p class="lh">🥁 Lab: Build a loop</p><p class="sm">Tap squares to turn sounds on, then press Play. Each row is one track, like in a DAW: three drums, then bass, guitar, piano, and strings playing the chords A minor, F, C, and G. The loop repeats until you press Stop. When you like it, export it as an MP3.</p><div class="beatgrid"></div><div class="row"><button type="button" class="btn bplay">▶ Play</button><button type="button" class="btn bclear">Clear</button><button type="button" class="btn bdemo">Load a starter loop</button><button type="button" class="btn bexp">⬇ Export as MP3</button></div><p class="bmsg sm" aria-live="polite"></p><p class="out sm bout" aria-live="polite"></p></div>
<p id="stu-3">This changed who gets to be a <b>producer</b>, the person who shapes how a recording sounds. <b>Billie Eilish</b> and her brother <b>Finneas O’Connell</b> recorded her first album, <i>When We All Fall Asleep, Where Do We Go?</i> (2019), in Finneas’s small bedroom in their family’s house in Los Angeles. In 2020, at age 18, Billie became the youngest artist ever to win the four biggest Grammy Awards in one night: Album, Record, and Song of the Year, and Best New Artist.</p>
<p id="stu-4">Even a phone can be a studio. The singer and guitarist <b>Steve Lacy</b> made beats on his iPhone, including the beat for Kendrick Lamar’s song “PRIDE.” (2017). Producers who work this way are often called <b>bedroom producers</b>.</p>
<p id="stu-6">AI has become a studio tool too. In the late 1970s John Lennon of the Beatles recorded a rough demo of a song called “Now and Then” on a cassette, with his voice and piano mixed together. In the 1990s the other Beatles could not separate his voice from the noisy piano, so the song stayed unfinished. Then a machine-learning tool built for Peter Jackson’s 2021 Beatles documentary <i>Get Back</i> pulled Lennon’s real voice out of the old tape. Paul McCartney and Ringo Starr finished the song in 2023, and in 2025 it won the Grammy for Best Rock Performance, the first AI-assisted recording to be nominated for a Grammy. McCartney stressed that nothing was faked: the AI cleaned up a voice that already existed.</p>
<div class="conn" id="stu-5"><p class="lh">🔗 Connection: visual art and theater</p><p>Painters went digital too. The British painter <b>David Hockney</b>, born in 1937, began drawing with his finger on an iPhone in 2007 and on an iPad from 2010. In the spring of 2020, at age 82, he made more than 100 iPad paintings of spring arriving at his home in Normandy, France. They were printed large and shown at the Royal Academy in London in 2021. Theater set designers moved from paper to software too. Programs such as AutoCAD, SketchUp, and Vectorworks let them build a 3D model of a set and change it in minutes instead of redrawing it by hand.</p><p class="seeart">🖼️ <a href="https://www.royalacademy.org.uk/exhibition/david-hockney" target="_blank" rel="noopener">See Hockney’s iPad paintings on the Royal Academy website</a> <span class="sm">(the artist does not allow free copies of these works, so we link to them)</span></p></div>
<div class="listen" data-k="studio"><p class="lh">🎬 Watch a producer at work</p><p><a href="https://youtu.be/xeGT5uu_lR0" target="_blank" rel="noopener">Billie Eilish and Finneas explain how they made “bury a friend”</a> <span class="who">YouTube</span></p><p class="lf">Watch and listen for:</p><ul><li>where they made almost all of their music</li><li>the everyday sounds Finneas recorded on his phone and turned into music</li><li>how the song’s structure is different from a typical pop song</li></ul><button type="button" class="btn heard">I watched it</button></div>

<template id="tpl-tune">
<p id="tun-1"><b>Pitch correction</b> is software that nudges a singer’s notes up or down until they are exactly in tune. The most famous pitch-correction program is <b>Auto-Tune</b>, released in 1997. It was invented by <b>Andy Hildebrand</b>, an engineer who had used math to study sound waves deep underground while searching for oil.</p>
<p id="tun-2">Used gently, Auto-Tune is almost impossible to hear, and many recordings use it to fix small mistakes. But producers soon found that turning the setting to its most extreme made notes jump instantly from pitch to pitch, so the voice sounded like a robot. Listeners loved the strange sound, and it became an effect of its own.</p>
<p id="tun-3">In the 2000s, the singer <b>T-Pain</b> made the robotic Auto-Tune sound his trademark, and many rap and pop artists copied it. In 2000, the French duo <b>Daft Punk</b> ran the singer Romanthony’s voice through heavy Auto-Tune on their hit “One More Time,” treating his voice like another synthesizer. Daft Punk’s Thomas Bangalter compared the complaints about Auto-Tune to the 1970s, when some musicians wanted to ban the synthesizer. Some musicians pushed back: in 2009, Jay-Z released a song called “D.O.A. (Death of Auto-Tune).” The argument continues today. Is pitch correction cheating, or is it just another instrument, like the electric guitar once was?</p>
<div class="lab tune"><p class="lh">🎚️ Lab: Tune the voice</p><p class="sm">Play the same short melody three ways. Listen for the wobbly notes, the smooth fix, and the robot jumps.</p><div class="row"><button type="button" class="btn tn" data-v="raw">Natural (a little off)</button><button type="button" class="btn tn" data-v="fix">Gently corrected</button><button type="button" class="btn tn" data-v="robot">Robot effect</button></div><p class="out sm" aria-live="polite"></p></div>
<p id="tun-4">Machines changed the voice even earlier. The <b>vocoder</b>, invented at Bell Labs in the 1930s to send voices over telephone lines, turns a voice into a robotic, synthesizer-like sound. Musicians from the German band Kraftwerk to the French duo Daft Punk later used vocoders in their songs.</p>
<div class="conn" id="tun-5"><p class="lh">🔗 Connection: visual art</p><p>Photos get “tuned” too. Apps can smooth skin, change colors, or erase objects from a picture, and many people now ask how much editing is too much. Some artists do the opposite. In <b>glitch art</b>, they break digital files on purpose and turn the errors, such as broken pixels, streaks, and scrambled colors, into art.</p><figure class="art"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGVAtADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDlsV3Wnf8AIPtf+uKfyFcNiu707/kH2v8A1xT+Qrlx/wAKI4Tf76p6L8yeilorzD7m4lFLRQFxKKWigLiUUtFAXEopaKAuJRS0UBcSilooC4lFLRQFxKKWigLiUUtFAXEopaKAuJRS0UBcSilooC4lFLRQFxKKWigLiUUtFAXEopaKAuJRS0UBcSilooC4lFLRQFxKKWigLiUUtFAXEopaKAuJRS0UBcSilooC4lFLRQFxKKWigLiUUtFAXEopaKAuJRS0UBcSilooC4lFLRQFxKKWigLiUUtFAXEopaKAuJRS0UBcSilooC4lFLRQFxKKWigLiUUtFAXEopaKAuJRS0UBcSilooC4lV2+8frVmq7feP1rzsw+GJcGcLXd6d/yD7X/AK4p/IVw2K7rTh/xL7X/AK4p/IV9Lj/hR8Dwo/31T0X5k9FLijFeYfcXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXEopcUYoC4lFLijFAXE <p id="vir-1">You met <b>sampling</b> in the hip-hop of the 1970s: borrowing a short recorded piece of an older song to build a new one. A <b>remix</b> is a new version of a song, made by changing its beat, its parts, or its singers. A <b>mashup</b> combines two or more songs into one track. With a DAW and the internet, anyone can sample, remix, and share music with the world.</p>
<p id="vir-2">In 2018, <b>Montero Lamar Hill</b>, a 19-year-old from the Atlanta area who calls himself <b>Lil Nas X</b>, bought a beat online for about <b>$30</b>. A teenage producer in the Netherlands called YoungKio had made it from a sample of banjo music by the rock band <b>Nine Inch Nails</b>. Lil Nas X rapped and sang over it about riding a horse, and he called his country-rap song “Old Town Road.”</p>
<p id="vir-3">The song spread through <b>TikTok</b>, where people made short videos of themselves turning into cowboys. Billboard removed it from its country chart, saying it was not country enough, and that started a big argument about who decides what a genre is. Then Lil Nas X released a remix with the country singer <b>Billy Ray Cyrus</b>. In 2019, “Old Town Road” spent <b>19 weeks</b> at number one on the Billboard Hot 100, a record at the time.</p>
<p id="vir-4">Because the beat uses Nine Inch Nails’ music, the band’s Trent Reznor and Atticus Ross are listed as songwriters of “Old Town Road.” Borrowing music the right way means asking permission and giving <b>credit</b>.</p>
<p id="vir-6">The internet also carries music across borders and languages. In 2018, eight of the ten most-watched music videos on YouTube worldwide were in Spanish, and the top two were reggaeton songs by Latin artists from the United States, Puerto Rico, and Colombia. That year Beyoncé joined the Colombian singer <b>J Balvin</b> on stage at the Coachella festival to perform their remix of his song “Mi Gente.”</p>
<div class="lab remix"><p class="lh">🔁 Lab: Remix an old tune</p><p class="sm">“Oh! Susanna” is an American song from 1848, so anyone may use it. Play the original, then try three remixes.</p><div class="row"><button type="button" class="btn rx" data-v="orig">Original</button><button type="button" class="btn rx" data-v="fast">Sped up</button><button type="button" class="btn rx" data-v="slow">Slow and low</button><button type="button" class="btn rx" data-v="beat">Add a trap beat</button></div><p class="out sm" aria-live="polite"></p></div>
<div class="conn" id="vir-5"><p class="lh">🔗 Connection: dance</p><p>Dances go viral too, and credit matters there as well. In 2019, <b>Jalaiah Harmon</b>, a 14-year-old dancer from the Atlanta area, created the “Renegade” dance. Millions of people copied it on TikTok, usually without knowing who made it, until a 2020 <i>New York Times</i> article told her story. Soon after, she was invited to perform it at the NBA All-Star Game.</p></div>
<div class="listen" data-k="viral"><p class="lh">🎬 Watch how a hit was made</p><p><a href="https://youtu.be/ptKqFafZgCk" target="_blank" rel="noopener">How “Old Town Road” became the number one song in the world</a> <span class="who">YouTube</span></p><p class="lf">Watch and listen for:</p><ul><li>where YoungKio made the beat, and where Lil Nas X found it</li><li>the banjo sample from Nine Inch Nails</li><li>how TikTok cowboy videos spread the song</li><li>how Billy Ray Cyrus joined the remix</li></ul><button type="button" class="btn heard">I watched it</button></div>

<p id="cho-1">In 2009, the American composer <b>Eric Whitacre</b> saw a video of a young woman singing one of his choral pieces alone in front of her webcam. It gave him an idea: what if hundreds of singers did the same thing, each recording a part at home, and all their videos were joined into one choir?</p>
<p id="cho-2">In 2010 he released his first <b>Virtual Choir</b>: <b>185 singers</b> from <b>12 countries</b> singing his piece <i>Lux Aurumque</i> (Latin for “light and gold”). Each singer put on headphones and watched a video of Whitacre conducting, then recorded a part alone and uploaded the video. Finally, an editor lined up every voice and every video so they sounded and looked like one choir.</p>
<p id="cho-3">The choirs kept growing. In 2020, while the COVID-19 pandemic kept people at home, Virtual Choir 6 sang Whitacre’s “Sing Gently” with <b>17,572 singers</b> from <b>129 countries</b>.</p>
<p id="cho-4">Why not just sing together on a video call? Because of <b>latency</b>, the tiny delay as sound travels across the internet. Even a delay of a fraction of a second makes singers fall out of time with each other. That is why virtual choirs record separately and are lined up later.</p>
<div class="lab choir"><p class="lh">🎶 Lab: Hear the latency problem</p><p class="sm">Turn on the four voices of a choir. Play them in sync, then play them the way they would sound on a live video call.</p><div class="row"><button type="button" class="btn layer" data-l="0" aria-pressed="true">Soprano</button><button type="button" class="btn layer" data-l="1" aria-pressed="true">Alto</button><button type="button" class="btn layer" data-l="2" aria-pressed="true">Tenor</button><button type="button" class="btn layer" data-l="3" aria-pressed="true">Bass</button></div><div class="row"><button type="button" class="btn cs" data-v="sync">▶ In sync (recorded and lined up)</button><button type="button" class="btn cs" data-v="lag">▶ With latency (live video call)</button></div></div>
<div class="conn" id="cho-5"><p class="lh">🔗 Connection: theater</p><p>The pandemic closed theaters around the world in March 2020. Broadway stayed dark for 18 months, until September 2021. Many theaters streamed recorded shows instead; London’s National Theatre put a free play on YouTube each week. In July 2020, a filmed version of <b>Lin-Manuel Miranda</b>’s musical <i>Hamilton</i> (2015), which tells the story of the founding father Alexander Hamilton with hip-hop, R&amp;B, and Broadway songs, came out on Disney+, so millions of people saw it at home. But going online can also leave people out. A 2025 study of theater audiences in Nigeria found that 68% of people aged 18 to 35 preferred livestreamed or online plays, yet only 22% of the people surveyed in rural areas had reliable internet. This gap is called the <b>digital divide</b>.</p></div>

<p id="ai-0">AI music is older than you might think. Composers have used rules, dice, and machines to make music for centuries, and the first computer music was played in 1951. Click through the history below.</p>
<div class="explorer" data-k="aihistory"><p class="lh">🔍 Machines that make music: a short history</p><div class="cards">
<div class="card"><h4>1650</h4><p>Athanasius Kircher, a German scholar, publishes a mathematical system for composing music meant to stir particular emotions.</p></div>
<div class="card"><h4>1700s</h4><p>Musical dice games are popular: you roll dice to choose which short musical bars come next, building a new piece at home.</p></div>
<div class="card"><h4>1843</h4><p>Mathematician and musician Ada Lovelace writes that Charles Babbage’s planned computer could work with music, but doubts a machine could ever truly “originate” anything.</p></div>
<div class="card"><h4>1951</h4><p>The Ferranti Mark 1 computer at the University of Manchester, England, plays music in the earliest known recording of a computer performing music.</p></div>
<div class="card"><h4>1957</h4><p>Lejaren Hiller and Leonard Isaacson use the ILLIAC I computer to generate the <i>Illiac Suite</i>, an early piece composed by a computer following rules.</p></div>
<div class="card"><h4>2019</h4><p>Holly Herndon’s album <i>PROTO</i> features an AI she called Spawn, trained partly on the voices of her own audiences.</p></div>
</div><div class="exnav"><button type="button" class="btn prev">← Back</button><span class="count"></span><button type="button" class="btn next">Next →</button></div></div>
<p id="ai-1">Some 21st-century singers are not people at all. <b>Vocaloid</b> is singing software made by the Yamaha company: you type in a melody and words, and it sings them in a voice built from recordings of a real singer. In 2007, the Japanese company Crypton Future Media released a Vocaloid voice called <b>Hatsune Miku</b>, made from the voice of the actress <b>Saki Fujita</b>. It came with a cartoon character: a 16-year-old girl with long turquoise pigtails.</p>
<p id="ai-2">Fans, not the company, made Miku famous. Thousands of amateur composers wrote songs for her and posted them online. Today she “performs” concerts with a live band while her animated image is projected onto a clear screen on stage, so she seems to float like a <b>hologram</b>.</p>
<div class="lab sing"><p class="lh">🗣️ Lab: A machine that sings</p><p class="sm">Type a word or a name. This little machine finds the vowels and sings each one on a new note, a bit like a very simple Vocaloid.</p><div class="row"><input class="singin" maxlength="24" aria-label="Word for the machine to sing" placeholder="Type a word" value="Mount Carmel"><button type="button" class="btn sgo">Sing it</button></div><p class="out sm" aria-live="polite"></p></div>
<p id="ai-3">Since 2022, <b>AI</b> (artificial intelligence) tools that create pictures, writing, and music from a short typed request have become available to the public. AI systems learn by studying huge amounts of existing art, music, and writing, called <b>training data</b>. Many artists have objected that their work was used to train these systems without their permission or any payment.</p>
<p id="ai-6">In April 2023, an anonymous TikTok user called Ghostwriter977 released “Heart on My Sleeve,” a song with AI vocals made to sound like the rapper <b>Drake</b> and the singer <b>the Weeknd</b>, who had nothing to do with it. It drew millions of views and plays within days. Then it was pulled from Spotify, Apple Music, and YouTube after a copyright claim by Universal Music Group, the record company of both stars. An AI copy of a real person’s voice is called a <b>voice clone</b>.</p>
<p id="ai-4">Musicians are deciding how to use these tools. The American composer <b>Holly Herndon</b> had already used an AI she called Spawn on her 2019 album <i>PROTO</i>. She trained an AI on her own voice and in 2021 released <b>Holly+</b>, a “digital twin” of her voice that other people can use to sing. The Recording Academy, which gives the Grammy Awards, decided in 2023 that <b>only human creators</b> can be nominated. A song made with some help from AI can be considered only if people did a meaningful part of the work.</p>
<p id="ai-7">Some composers are trying to use AI more fairly. For his 2025 orchestra piece <i>Techno-utopia</i>, the British composer <b>Robert Laidlow</b> trained AI only on about 2,500 hours of BBC Radio 3 broadcasts by one orchestra, the BBC Philharmonic, used with permission, instead of on music gathered from the whole internet. Laidlow points out a problem many people miss: most recordings are owned by record companies, not by the artists, so a company can allow AI to train on a song even if the singer never agreed.</p>
<p id="ai-8">Across all the arts, AI shows up in three ways. It can be a <b>repair tool</b> that cleans up or fixes real work, like the Beatles’ “Now and Then.” It can be a <b>creative partner</b> that an artist chooses to work with, like Holly+ or Robert Laidlow’s orchestra AI. Or it can be a <b>fake copy</b> that imitates artists without asking, like “Heart on My Sleeve.” In painting, film, and music alike, people keep asking the same three questions: Did the artists agree? Are they paid? Who gets the credit?</p>
<div class="explorer" data-k="aiarts" id="ai-9"><p class="lh">🔍 AI across the arts</p><div class="cards">
<div class="card"><h4>2022 · Painting</h4><p>Jason Allen won first prize in digital art at the Colorado State Fair with <i>Théâtre D’opéra Spatial</i>, an image he made with the AI program Midjourney and then edited. Many artists were angry, and in 2023 the U.S. Copyright Office refused to protect the image because the AI, not Allen, made most of it.</p><figure class="art"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Th%C3%A9%C3%A2tre%20D%E2%80%99op%C3%A9ra%20Spatial.jpg?width=900" alt="Théâtre D’opéra Spatial: figures in flowing robes stand in a grand, golden hall looking out through a giant round window at a bright landscape." loading="lazy" onerror="this.parentNode.classList.add('noimg')"><p class="imgfail">The image could not load here. <a href="https://commons.wikimedia.org/wiki/File:Th%C3%A9%C3%A2tre%20D%E2%80%99op%C3%A9ra%20Spatial.jpg" target="_blank" rel="noopener">See it on Wikimedia Commons</a>.</p><figcaption>Jason M. Allen with Midjourney, <i>Théâtre D’opéra Spatial</i>, 2022. <span class="credit">Public domain, via Wikimedia Commons (<a href="https://commons.wikimedia.org/wiki/File:Th%C3%A9%C3%A2tre%20D%E2%80%99op%C3%A9ra%20Spatial.jpg" target="_blank" rel="noopener">public domain</a>)</span></figcaption></figure></div>
<div class="card"><h4>2023 · Film and TV</h4><p>Hollywood actors went on strike from July to November. One big reason was AI: studios wanted to scan actors and reuse their digital copies. The deal that ended the strike says studios must get an actor’s clear permission, and pay them, to make or use a <b>digital replica</b>.</p></div>
<div class="card"><h4>2024 · Robots and portraits</h4><p>Ai-Da, a humanoid robot artist named after Ada Lovelace, painted a portrait of the computer pioneer Alan Turing. It sold at Sotheby’s auction house for $1.08 million, and critics argued about whether a robot can be an artist.</p><figure class="art"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Ai-Da%20Robot%20at%20Abu%20Dhabi%20Art.jpg?width=900" alt="Ai-Da, a humanoid robot artist with a dark bob haircut and robotic arms, at an art fair." loading="lazy" onerror="this.parentNode.classList.add('noimg')"><p class="imgfail">The image could not load here. <a href="https://commons.wikimedia.org/wiki/File:Ai-Da%20Robot%20at%20Abu%20Dhabi%20Art.jpg" target="_blank" rel="noopener">See it on Wikimedia Commons</a>.</p><figcaption>Ai-Da, the robot artist, at the Abu Dhabi Art fair. (The Turing portrait itself is not free to copy.) <span class="credit">Photo: Lennymur (<a href="https://commons.wikimedia.org/wiki/File:Ai-Da%20Robot%20at%20Abu%20Dhabi%20Art.jpg" target="_blank" rel="noopener">CC BY-SA 4.0</a>)</span></figcaption></figure></div>
<div class="card"><h4>2025 · Music business</h4><p>Record companies that had sued the AI music generators Suno and Udio began making deals with them instead: Universal with Udio in October and Warner with Suno in November. The companies promised new AI tools trained only on licensed music, where artists can choose to opt in.</p></div>
<div class="card"><h4>2026 · Streaming</h4><p>The streaming service Deezer reported that by June 2026 more than half of the songs uploaded each day were made entirely by AI. Yet AI songs were only 1% to 3% of what people actually listened to, and Deezer labels them so listeners know.</p></div>
</div><div class="exnav"><button type="button" class="btn prev">← Back</button><span class="count"></span><button type="button" class="btn next">Next →</button></div></div>
<div class="conn" id="ai-5"><p class="lh">🔗 Connection: visual art</p><p>In 2022, the Museum of Modern Art (MoMA) in New York showed <i>Unsupervised</i> by the Turkish-American artist <b>Refik Anadol</b>. He trained an AI on images of more than 200 years of art in MoMA’s collection, and the AI created a giant, ever-changing digital “painting” that flowed across a wall of the museum’s lobby.</p><figure class="art"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Unsupervised%20by%20Refik%20Anadol.jpg?width=900" alt="Refik Anadol’s Unsupervised: a tall digital wall in the MoMA lobby filled with swirling, colorful AI-generated forms." loading="lazy" onerror="this.parentNode.classList.add('noimg')"><p class="imgfail">The image could not load here. <a href="https://commons.wikimedia.org/wiki/File:Unsupervised%20by%20Refik%20Anadol.jpg" target="_blank" rel="noopener">See it on Wikimedia Commons</a>.</p><figcaption>Refik Anadol, <i>Unsupervised</i>, 2022, at the Museum of Modern Art, New York. <span class="credit">Photo: Refik Anadol (<a href="https://commons.wikimedia.org/wiki/File:Unsupervised%20by%20Refik%20Anadol.jpg" target="_blank" rel="noopener">CC BY-SA 4.0</a>)</span></figcaption></figure></div>
<div class="listen" data-k="ai"><p class="lh">🎬 Hear a computer singer</p><p><a href="https://www.youtube.com/watch?v=jhl5afLEKdo" target="_blank" rel="noopener">Hatsune Miku: “World is Mine” by ryo (supercell)</a> <span class="who">YouTube</span></p><p class="lf">Watch and listen for:</p><ul><li>whether the voice sounds human, robotic, or both</li><li>how fast and high the singing can go</li><li>how the cartoon character gives the software voice a “face”</li></ul><button type="button" class="btn heard">I watched it</button></div>

<p id="wor-1"><b>Immersive art</b> surrounds you, so you step inside it instead of looking at it in a frame. In Tokyo, the art group <b>teamLab</b>, founded in 2001, opened <b>teamLab Borderless</b> in 2018: dark rooms filled with projected digital flowers, waterfalls, and lights that drift from room to room and change when visitors touch them or walk past. More than two million people visited in its first year, a world record for a museum devoted to a single art group.</p>
<p id="wor-2">Music in video games has to be immersive too. In a movie the music never changes, but in a game nobody knows what the player will do next. So composers write <b>adaptive music</b>, which changes as you play. It may add drums when an enemy appears, grow quiet while you explore, or switch to a victory theme when you win. Composers often write it in <b>layers</b>, like the tracks in a DAW, and the game turns the layers on and off.</p>
<div class="lab adapt"><p class="lh">🎮 Lab: Adaptive music</p><p class="sm">Press Play, then switch the game state. Listen to the layers change while the music keeps going.</p><div class="row"><button type="button" class="btn aplay">▶ Play</button><button type="button" class="btn ast" data-s="explore" aria-pressed="true">🌲 Explore</button><button type="button" class="btn ast" data-s="danger" aria-pressed="false">⚔️ Danger</button><button type="button" class="btn ast" data-s="win" aria-pressed="false">🏆 Victory</button></div><p class="out sm" aria-live="polite">Layers playing: none yet</p></div>
<p id="wor-3">Game music now fills concert halls, and orchestras around the world give whole concerts of music from games such as <i>The Legend of Zelda</i> and <i>Final Fantasy</i>. In 2013, <b>Austin Wintory</b>’s score for the game <i>Journey</i> (2012) became the first video game soundtrack ever nominated for a Grammy. In 2023, the Grammys added an award just for video game music. Its first winner was the composer <b>Stephanie Economou</b>, for <i>Assassin’s Creed Valhalla: Dawn of Ragnarök</i>.</p>
<div class="conn" id="wor-4"><p class="lh">🔗 Connection: dance</p><p>The British choreographer <b>Wayne McGregor</b> worked with Google Arts &amp; Culture to train an AI on videos from his dance company’s 25-year archive. The tool, called <b>Living Archive</b> (2019), suggests new movements in McGregor’s style, and his dancers try them out and build them into new choreography.</p></div>
<p id="wor-6">In the 21st century, music often arrives inside another digital art form: an app, a video game, or a concert where the performers are not really there. Click through three examples.</p>
<div class="explorer" data-k="musicmeets" id="wor-7"><p class="lh">🔍 When music meets the other digital arts</p><div class="cards">
<div class="card"><h4>2011 · Music + app design</h4><p>Björk released her album <i>Biophilia</i> with an app: each song is a star in a galaxy, and touching it opens a mini-game where you play with the music and the visuals. In 2014 it became the first downloadable app in MoMA’s collection.</p><p class="seeart">🖼️ <a href="https://www.moma.org/explore/inside_out/2014/06/11/biophilia-the-first-app-in-momas-collection/" target="_blank" rel="noopener">See screens from Biophilia on MoMA’s website</a> <span class="sm"></span></p></div>
<div class="card"><h4>2020 · Music + video games</h4><p>During the pandemic, rapper Travis Scott gave a concert called <i>Astronomical</i> inside the game <i>Fortnite</i>. A giant avatar of Scott walked across the game’s island, and 12.3 million players watched the first show live, a record for a concert in a video game.</p></div>
<div class="card"><h4>2022 · Music + motion capture + dance</h4><p>In <i>ABBA Voyage</i> in London, the Swedish band ABBA performs as digital “ABBAtars” that look the way they did in 1979, with a real 10-piece band on stage. The members spent five weeks in motion-capture suits, filmed by 160 cameras, and the choreographer was Wayne McGregor.</p></div>
</div><div class="exnav"><button type="button" class="btn prev">← Back</button><span class="count"></span><button type="button" class="btn next">Next →</button></div></div>
<div class="conn" id="wor-5"><p class="lh">🔗 Connection: theater</p><p>Theaters use computers too. Automated stage machinery can move scenery smoothly and fly large objects, even a full-size car over the audience in a stage production of <i>Chitty Chitty Bang Bang</i>. A person still runs the control desk, though, because live actors never do exactly the same thing every night. In interactive theater, sensors let performers trigger sounds and projected images with their own movements.</p></div>

<template id="tpl-words">
<div><dt>Adaptive music</dt><dd>Music in a video game that changes as you play, often by turning layers on and off.</dd></div>
<div><dt>Algorithm</dt><dd>A set of step-by-step computer rules, such as the ones streaming apps use to recommend songs.</dd></div>
<div><dt>Artificial intelligence (AI)</dt><dd>Computer systems that learn from huge amounts of examples and can create text, pictures, or music.</dd></div>
<div><dt>Auto-Tune</dt><dd>The best-known pitch-correction software, released in 1997 and invented by Andy Hildebrand.</dd></div>
<div><dt>Contemporary art</dt><dd>Art made by living artists in our own time.</dd></div>
<div><dt>Credit</dt><dd>Naming the person who created a song, dance, or artwork when you use or share it.</dd></div>
<div><dt>Digital audio workstation (DAW)</dt><dd>Software for recording, editing, and mixing music, such as GarageBand or Ableton Live.</dd></div>
<div><dt>Digital avatar</dt><dd>A computer-made figure that represents a real person, like the ABBAtars in <i>ABBA Voyage</i> or Travis Scott in <i>Fortnite</i>.</dd></div>
<div><dt>Digital divide</dt><dd>The gap between people who have reliable internet and technology and people who do not.</dd></div>
<div><dt>Digital replica</dt><dd>An AI or computer copy of a real person’s face, body, or voice, used in film, TV, or music.</dd></div>
<div><dt>Glitch art</dt><dd>Art made by breaking digital files on purpose and turning the errors into images.</dd></div>
<div><dt>Hologram</dt><dd>An image that seems to float in the air in three dimensions; Hatsune Miku’s concerts use projections that look like one.</dd></div>
<div><dt>Immersive art</dt><dd>Art that surrounds you, so you step inside it, such as teamLab Borderless.</dd></div>
<div><dt>Latency</dt><dd>The tiny delay as sound or video travels across the internet.</dd></div>
<div><dt>Loop</dt><dd>A short musical pattern that repeats.</dd></div>
<div><dt>Motion capture</dt><dd>Recording a real person’s movements with cameras and sensors so a digital character can move the same way.</dd></div>
<div><dt>Mashup</dt><dd>Two or more songs combined into one track.</dd></div>
<div><dt>MIDI controller</dt><dd>A keyboard or set of pads that sends notes to a computer using MIDI, a computer language for music.</dd></div>
<div><dt>Pitch correction</dt><dd>Software that moves a singer’s notes up or down until they are exactly in tune.</dd></div>
<div><dt>Producer</dt><dd>The person who shapes how a recording sounds.</dd></div>
<div><dt>Remix</dt><dd>A new version of a song made by changing its beat, its parts, or its singers.</dd></div>
<div><dt>Sampling</dt><dd>Borrowing a short recorded piece of an older song to build a new one.</dd></div>
<div><dt>Streaming</dt><dd>Playing music or video straight from the internet instead of owning a copy.</dd></div>
<div><dt>Training data</dt><dd>The art, music, or writing an AI system studies in order to learn.</dd></div>
<div><dt>Track</dt><dd>One recorded layer of a song, such as the drums or the voice, in a DAW.</dd></div>
<div><dt>Viral</dt><dd>Spreading very quickly online as people share something again and again.</dd></div>
<div><dt>Virtual choir</dt><dd>A choir of singers who record their parts separately, often in different countries, joined together by an editor.</dd></div>
<div><dt>Voice clone</dt><dd>An AI copy of a real person’s voice, like the fake Drake and the Weeknd voices in “Heart on My Sleeve.”</dd></div>
<div><dt>Vocaloid</dt><dd>Yamaha’s singing software, which sings typed-in words and melodies in a voice built from a real singer’s recordings.</dd></div>
</template>

function snakeSVG(hd, tl, k){ var dx = tl.x - hd.x, dy = tl.y - hd.y, len = Math.sqrt(dx * dx + dy * dy), px = -dy / len, py = dx / len, w = Math.min(46, 18 + len * 0.08), sg = k % 2 ? 1 : -1,
  c1 = {x: hd.x + dx * 0.3 + px * w * sg, y: hd.y + dy * 0.3 + py * w * sg}, c2 = {x: hd.x + dx * 0.7 - px * w * sg, y: hd.y + dy * 0.7 - py * w * sg}, d = "M" + hd.x + " " + hd.y + " C" + c1.x + " " + c1.y + " " + c2.x + " " + c2.y + " " + tl.x + " " + tl.y, ang = Math.atan2(c1.y - hd.y, c1.x - hd.x) * 180 / Math.PI + 180;
  return '<g class="snake"><path class="body" d="' + d + '"/><path class="spots" d="' + d + '"/><g transform="translate(' + hd.x + " " + hd.y + ") rotate(" + ang + ')"><rect class="head" x="-17" y="-14" width="30" height="28" rx="6"/><rect class="eye" x="-6" y="-10" width="7" height="7"/><rect class="eye" x="-6" y="3" width="7" height="7"/><path class="tongue" d="M13 0 h10 l5 -5 M23 0 l5 5"/></g></g>'; }
function boardHTML(){ COLS = cols(); var c = COLS, rows = END / c, h = "", ctr = function(n){ var p = rc(n); return {x: p.col * 100 + 50, y: p.row * 100 + 50}; }, ov = "", k = 0;
  for (var n = 1; n <= END; n++){ var p = rc(n), i = SQ[n], s = i !== undefined ? stops[i] : null, cls = "cell c" + ((p.row + p.col) % 4), inner = '<span class="n">' + n + "</span>";
    if (n === END){ cls = "cell finish"; inner += '<span class="si">🏁</span>'; } else if (s){ cls = "cell special"; inner += '<span class="si">' + s.icon + "</span>"; }
    h += '<div class="' + cls + '" style="grid-row:' + (p.row + 1) + ";grid-column:" + (p.col + 1) + '" data-n="' + n + '">' + inner + '<span class="toks"></span></div>'; }
  Object.keys(LAD).forEach(function(b){ ov += ladderSVG(ctr(+b), ctr(LAD[b])); }); Object.keys(SNK).forEach(function(s){ ov += snakeSVG(ctr(+s), ctr(SNK[s]), k++); });
  return '<div class="grid" style="grid-template-columns:repeat(' + c + ',1fr);grid-template-rows:repeat(' + rows + ',1fr);aspect-ratio:' + c + "/" + rows + '">' + h + '<svg class="over" viewBox="0 0 ' + c * 100 + " " + rows * 100 + '" aria-hidden="true">' + ov + '</svg></div><div class="startpad" data-n="0"><span class="si">▶ Start</span><span class="toks"></span></div>'; }
function placeTokens(){ $$("#board .toks").forEach(function(t){ t.innerHTML = ""; });
  G.teams.forEach(function(t, i){ var c = $('#board [data-n="' + Math.min(t.pos, END) + '"] .toks'); if (c) c.insertAdjacentHTML("beforeend", '<span class="me tk' + (i === G.turn ? " cur" : "") + '" style="--tc:' + t.color + '" title="' + esc(t.name) + '">' + t.tok + "</span>"); }); }
function dieFace(n){ var on = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n] || []; return [0,1,2,3,4,5,6,7,8].map(function(k){ return '<i style="visibility:' + (on.indexOf(k) > -1 ? "visible" : "hidden") + '"></i>'; }).join(""); }
function nextStop(t){ for (var i = 0; i < stops.length; i++) if (!t.cleared[stops[i].id]) return stops[i]; return null; }
function cap(t){ var s = nextStop(t); return s && s.sq >= t.pos ? s.sq : END; }

/* ---------- screens ---------- */
var screen = $("#screen"), busy = false;
function setup(){ var saved = G && !G.over;
  screen.className = "center";
  screen.innerHTML = '<p class="date">Class game for 2 to 4 teams</p><h1 class="big"><span>Snakes</span><span class="amp">&amp;</span><span>Ladders</span></h1><p class="tagline">The Digital Stage · Team Edition</p>' +
    '<div class="setup"><p class="lede">Name the teams. Teams take turns rolling; every pink square is a team question about 21st-century arts and technology.</p>' +
    [0,1,2,3].map(function(i){ return '<label class="tm" style="--tc:' + COLORS[i] + '"><span class="e">' + TOK[i] + '</span><input id="tn' + i + '" value="Team ' + (i + 1) + '" maxlength="20" aria-label="Team ' + (i + 1) + ' name"><span class="sm">' + (i < 2 ? "" : '<input type="checkbox" id="tu' + i + '" checked> playing') + "</span></label>"; }).join("") +
    '<label class="opt">Time to answer each question: <select id="tsel"><option value="0">No timer</option><option value="30" selected>30 seconds</option><option value="45">45 seconds</option><option value="60">60 seconds</option></select></label></div>' +
    '<div class="btns"><button class="btn gold" id="start">Start a new game</button>' + (saved ? '<button class="btn ghost" id="resume">Continue the saved game</button>' : "") + '<button class="btn ghost" id="rules">How to play</button></div>';
  $("#start").onclick = function(){ var names = [0,1,2,3].filter(function(i){ return i < 2 || $("#tu" + i).checked; }).map(function(i){ return $("#tn" + i).value.trim() || "Team " + (i + 1); });
    newGame(names, +$("#tsel").value); AC(); board(); };
  if (saved) $("#resume").onclick = board;
  $("#rules").onclick = rules; }
function rules(){ screen.className = "center";
  screen.innerHTML = '<h2>How to play</h2><ol class="how"><li>Teams take turns. On your turn, one team member presses <b>Roll the die</b>.</li>' +
    '<li>The seven pink squares are <b>challenge squares</b>. Every team must stop on each one, even if it rolled more.</li>' +
    '<li>The first time any team lands on a challenge square, the notes for that square open on the screen. Read them together as a class. Then The Glitch asks the team a question. Talk it over, then choose one answer. Right: you clear that square and score a point. Wrong: slide back 3 squares and try again with a new question when you return.</li>' +
    '<li>🪜 Land at the foot of a ladder? Answer <b>Fact or glitch?</b> correctly to climb. 🐍 Land on a snake’s head? Answer correctly to dodge it, or slide down.</li>' +
    '<li>The first team to reach square 50 wins. If time runs out, the team farthest along wins; ties go to the team with more correct answers.</li>' +
    '<li>Respect the timer, and only one answer per team!</li></ol><div class="btns"><button class="btn gold" id="back">Back</button></div>';
  $("#back").onclick = function(){ G && !G.over && $("#board") === null && G.teams ? setup() : setup(); }; }
function board(){ screen.className = "boardscr";
  screen.innerHTML = '<div class="bwrap"><div class="board" id="board" role="group" aria-label="Game board">' + boardHTML() + '</div><div class="side" id="side"></div></div>';
  placeTokens(); side(); }
window.addEventListener("resize", function(){ if ($("#board") && cols() !== COLS && !busy) board(); });
function side(){ var t = team(), html = '<div class="turn" style="--tc:' + t.color + '"><span class="e">' + t.tok + '</span><span><small>Now playing</small><b>' + esc(t.name) + "</b></span></div>" +
    '<div class="die" id="die" aria-hidden="true">' + dieFace(G.last) + '</div><button class="btn gold" id="roll"' + (busy || G.over ? " disabled" : "") + ">Roll the die</button>";
  html += '<table class="score"><thead><tr><th>Team</th><th>Square</th><th>✓</th></tr></thead><tbody>' + G.teams.map(function(x, i){ return '<tr class="' + (i === G.turn ? "on" : "") + '"><td><span style="color:' + x.color + '">●</span> ' + x.tok + " " + esc(x.name) + "</td><td>" + x.pos + "</td><td>" + x.right + "</td></tr>"; }).join("") + "</tbody></table>";
  html += '<ul class="log" aria-live="polite">' + G.log.slice(0, 4).map(function(l){ return "<li>" + l + "</li>"; }).join("") + "</ul>";
  html += '<p class="nlab">📖 Lesson notes</p><div class="nbtns">' + stops.map(function(s){ return '<button type="button" class="nb" data-i="' + s.i + '" title="' + esc(s.title) + '">' + s.icon + "<small>" + s.sq + "</small></button>"; }).join("") + "</div>";
  html += '<div class="tools"><button class="btn ghost2" id="skip">Skip turn</button><button class="btn ghost2" id="endg">End game</button><button class="btn ghost2" id="snd">' + (soundOn ? "🔊 Sound on" : "🔈 Sound off") + "</button></div>";
  $("#side").innerHTML = html; $("#roll").onclick = roll;
  $("#skip").onclick = function(){ if (busy) return; addLog("⏭ " + esc(team().name) + " skipped a turn."); nextTurn(); };
  $("#endg").onclick = function(){ if (busy) return; if (confirm("End the game now and show the winners?")) finish(); };
  $("#snd").onclick = function(){ soundOn = !soundOn; side(); };
  $$("#side .nb").forEach(function(b){ b.onclick = function(){ if (busy) return; showNotes(stops[+b.dataset.i]); }; }); }
function nextTurn(){ G.turn = (G.turn + 1) % G.teams.length; save(); placeTokens(); side(); }
function walk(t, to, done){ var step = function(){ if (t.pos === to) return done(); t.pos += to > t.pos ? 1 : -1; placeTokens(); sStep(); setTimeout(step, RM ? 0 : 170); }; step(); }
function roll(){ if (busy || G.over) return; busy = true; var t = team(), r = 1 + Math.floor(Math.random() * 6), d = $("#die"); G.last = r; t.rolls++;
  d.innerHTML = dieFace(r); d.classList.remove("roll"); void d.offsetWidth; d.classList.add("roll"); $("#roll").disabled = true; tone([60 + r * 2], 0.12, "square", 0, 0.05);
  var to = Math.min(t.pos + r, cap(t), END);
  setTimeout(function(){ walk(t, to, function(){
    var i = SQ[to], s = i !== undefined ? stops[i] : null;
    addLog(t.tok + " " + esc(t.name) + " rolled " + r + ".");
    if (to >= END){ save(); busy = false; return finish(t); }
    if (s && !t.cleared[s.id]) return setTimeout(function(){ if (!G.read[s.id]) showNotes(s, t, function(){ challenge(t, s); }); else challenge(t, s); }, RM ? 0 : 350);
    if (LAD[to] || SNK[to]) return setTimeout(function(){ hazard(t, to); }, RM ? 0 : 350);
    busy = false; nextTurn(); }); }, RM ? 0 : 450); }

/* ---------- lesson notes on the big screen ---------- */
function notesHTML(s){ var box = document.createElement("div"); box.innerHTML = document.getElementById("tpl-" + s.id).innerHTML;
  $$(".tryit, .discuss, .lab", box).forEach(function(x){ x.remove(); });
  $$(".listen .heard", box).forEach(function(x){ x.remove(); });
  $$(".explorer", box).forEach(function(x){ x.removeAttribute("id"); });
  return box.innerHTML; }
function initExplorers(root){ $$(".explorer", root).forEach(function(ex){ var cards = $$(".card", ex), i = 0, prev = $(".prev", ex), next = $(".next", ex), cnt = $(".count", ex);
  function sh(){ cards.forEach(function(c, k){ c.classList.toggle("on", k === i); }); cnt.textContent = (i + 1) + " of " + cards.length; prev.disabled = i === 0; next.disabled = i === cards.length - 1; }
  prev.onclick = function(){ if (i > 0){ i--; sh(); } }; next.onclick = function(){ if (i < cards.length - 1){ i++; sh(); } }; sh(); }); }
function showNotes(s, t, then){
  var head = t ? '<div class="qhead" style="--tc:' + t.color + '"><span class="e">' + t.tok + '</span><span><small>' + esc(t.name) + ' landed on a challenge square</small><b>' + s.icon + " Square " + s.sq + ": " + esc(s.title) + "</b></span></div>"
               : '<div class="qhead" style="--tc:#3b3fa8"><span class="e">' + s.icon + '</span><span><small>Lesson notes</small><b>Square ' + s.sq + ": " + esc(s.title) + "</b></span></div>";
  overlay(head + '<p class="lede ntip">' + (t ? "📖 Read these notes together as a class. Then " + esc(t.name) + " answers The Glitch’s question." : "📖 Review the notes for this square.") + '</p><article class="program notes-big"><h2>' + esc(s.title) + "</h2>" + notesHTML(s) + "</article>" +
    '<div class="btns"><button class="btn gold" id="nready" data-focus>' + (t ? "We’re ready for the question" : "Close the notes") + "</button></div>",
    function(){ initExplorers($("#ov")); $("#ov").scrollTop = 0; $("#nready").onclick = function(){ G.read[s.id] = 1; save(); if (then) then(); else closeOv(); }; }); }

/* ---------- question overlay ---------- */
var tmr = null;
function overlay(html, after){ var o = $("#ov"); o.innerHTML = '<div class="qcard">' + html + "</div>"; o.hidden = false; if (after) after(); var f = $("[data-focus]", o); if (f) f.focus({preventScroll: true}); o.scrollTop = 0; }
function closeOv(){ clearInterval(tmr); $("#ov").hidden = true; $("#ov").innerHTML = ""; }
function startTimer(onEnd){ clearInterval(tmr); if (!G.timer) return; var left = G.timer, el = $("#qt"); el.hidden = false;
  var paint = function(){ el.textContent = "⏱ " + left; el.classList.toggle("low", left <= 10); };
  paint(); tmr = setInterval(function(){ left--; paint(); if (left <= 0){ clearInterval(tmr); onEnd(); } }, 1000); }
function pickQ(s){ var used = G.used[s.id] || [], pool = s.bank.map(function(_, k){ return k; }).filter(function(k){ return used.indexOf(k) < 0; });
  if (!pool.length){ used = []; pool = s.bank.map(function(_, k){ return k; }); } var q = pool[Math.floor(Math.random() * pool.length)]; used.push(q); G.used[s.id] = used; return q; }
function answerButtons(opts, right){ return '<div class="answers">' + opts.map(function(o, k){ return '<button type="button" class="ans" data-ok="' + (o === right ? 1 : 0) + '"' + (k === 0 ? " data-focus" : "") + '><span class="lt">' + "ABC"[k] + "</span> " + o + "</button>"; }).join("") + "</div>"; }
function challenge(t, s){ var b = s.bank[pickQ(s)], opts = shuffle([b[1]].concat(b[2]));
  overlay('<div class="qhead" style="--tc:' + t.color + '"><span class="e">' + t.tok + '</span><span><small>' + esc(t.name) + '</small><b>' + s.icon + " Square " + s.sq + ": " + esc(s.title) + '</b></span><span class="qt" id="qt" hidden></span></div>' +
    '<div class="speaker">' + window.SVGS.glitch + '<div class="bubble"><span class="who">The Glitch asks</span>' + b[0] + "</div></div>" + answerButtons(opts, b[1]) + '<p class="feedback" id="fb" aria-live="polite"></p><div class="btns" id="go" hidden></div><div class="btns" id="rev"><button class="btn ghost" id="review">📖 Read the notes again</button></div>',
    function(){ $("#review").onclick = function(){ clearInterval(tmr); showNotes(s, t, function(){ challenge(t, s); }); };
      var done = false, judge = function(btn){ if (done) return; done = true; clearInterval(tmr); $("#rev").hidden = true;
        $$("#ov .ans").forEach(function(x){ x.disabled = true; if (x.dataset.ok === "1") x.classList.add("right"); });
        var ok = btn && btn.dataset.ok === "1"; if (btn && !ok) btn.classList.add("wrong");
        if (ok){ t.cleared[s.id] = true; t.right++; sGood(); $("#fb").textContent = "Correct! " + t.name + " clears square " + s.sq + " and scores a point.";
          addLog("✅ " + esc(t.name) + " cleared square " + s.sq + "."); }
        else { t.wrong++; sBad(); $("#fb").textContent = (btn ? "Not quite." : "Time’s up!") + " The answer is: " + b[1] + ". " + t.name + " slides back 3 squares.";
          addLog("⚡ " + esc(t.name) + " missed square " + s.sq + " and slid back."); }
        save(); var g = $("#go"); g.hidden = false; g.innerHTML = '<button class="btn gold" id="cont">Next team</button>'; $("#cont").focus();
        $("#cont").onclick = function(){ closeOv(); if (!ok){ var to = Math.max(0, s.sq - 3); walk(t, to, function(){ busy = false; save(); nextTurn(); }); } else { busy = false; nextTurn(); } }; };
      $$("#ov .ans").forEach(function(x){ x.onclick = function(){ judge(x); }; }); startTimer(function(){ judge(null); }); }); }
function pickFact(){ var all = []; stops.forEach(function(s){ s.facts.forEach(function(f, k){ all.push({f: f, key: s.id + k}); }); });
  var fresh = all.filter(function(p){ return !G.fused[p.key]; }); if (!fresh.length){ G.fused = {}; fresh = all; } var p = fresh[Math.floor(Math.random() * fresh.length)]; G.fused[p.key] = 1; return p.f; }
function hazard(t, sq){ var isL = !!LAD[sq], dest = isL ? LAD[sq] : SNK[sq], f = pickFact();
  overlay('<div class="qhead" style="--tc:' + t.color + '"><span class="e">' + t.tok + '</span><span><small>' + esc(t.name) + '</small><b>' + (isL ? "🪜 Ladder! Climb to square " + dest + "?" : "🐍 Snake on square " + sq + "!") + '</b></span><span class="qt" id="qt" hidden></span></div>' +
    '<div class="speaker">' + (isL ? window.SVGS.bot : window.SVGS.glitch) + '<div class="bubble"><span class="who">' + (isL ? "Patch asks" : "The Glitch hisses") + "</span>" + (isL ? "Fact or glitch? Get it right to climb the ladder." : "Fact or glitch? Get it right, or slide down to square " + dest + ".") + "</div></div>" +
    '<p class="claim">“' + f[0] + '”</p><div class="answers two"><button type="button" class="ans" data-v="1" data-focus>✅ Fact</button><button type="button" class="ans" data-v="0">⚡ Glitch</button></div><p class="feedback" id="fb" aria-live="polite"></p><div class="btns" id="go" hidden></div>',
    function(){ var done = false, judge = function(btn){ if (done) return; done = true; clearInterval(tmr);
        var ok = !!btn && (btn.dataset.v === "1") === f[1]; $$("#ov .ans").forEach(function(x){ x.disabled = true; if ((x.dataset.v === "1") === f[1]) x.classList.add("right"); else if (x === btn) x.classList.add("wrong"); });
        $("#fb").textContent = (btn ? "" : "Time’s up! ") + f[2]; if (ok) sGood(); else sBad();
        var move = (isL && ok) || (!isL && !ok), label = isL ? (ok ? "Climb to square " + dest : "Stay on square " + sq) : (ok ? "Dodge the snake" : "Slide down to square " + dest);
        addLog(isL ? (ok ? "🪜 " + esc(t.name) + " climbed to " + dest + "." : "🪜 " + esc(t.name) + " missed the ladder.") : (ok ? "🐍 " + esc(t.name) + " dodged the snake." : "🐍 " + esc(t.name) + " slid to " + dest + "."));
        var g = $("#go"); g.hidden = false; g.innerHTML = '<button class="btn gold" id="cont">' + label + "</button>"; $("#cont").focus();
        $("#cont").onclick = function(){ closeOv(); if (move){ if (isL) sClimb(); else sSlide(); t.pos = dest; placeTokens(); } busy = false; save(); nextTurn(); }; };
      $$("#ov .ans").forEach(function(x){ x.onclick = function(){ judge(x); }; }); startTimer(function(){ judge(null); }); }); }

/* ---------- finish ---------- */
function finish(winner){ G.over = true; save(); sWin(); closeOv();
  var rank = G.teams.slice().sort(function(a, b){ return (b.pos - a.pos) || (b.right - a.right) || (a.wrong - b.wrong); }), first = winner || rank[0];
  screen.className = "center";
  screen.innerHTML = '<div class="bigicon">🏆</div><h1 class="big"><span>' + esc(first.name) + '</span></h1><p class="lede">' + (winner ? first.tok + " " + esc(first.name) + " reached square 50 and rebooted the Digital Stage!" : "Time’s up! " + esc(first.name) + " got the farthest.") + "</p>" +
    '<div class="program"><h3>Final standings</h3><div class="tablewrap"><table><thead><tr><th>Place</th><th>Team</th><th>Square</th><th>Correct</th><th>Missed</th></tr></thead><tbody>' +
    rank.map(function(x, i){ return "<tr><td>" + (i + 1) + "</td><td>" + x.tok + " " + esc(x.name) + "</td><td>" + x.pos + "</td><td>" + x.right + "</td><td>" + x.wrong + "</td></tr>"; }).join("") + "</tbody></table></div></div>" +
    '<div class="btns"><button class="btn gold" id="again">New game</button></div>';
  $("#again").onclick = setup; }

document.addEventListener("keydown", function(e){ if (e.key === " " && $("#roll") && !$("#roll").disabled && $("#ov").hidden && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); roll(); } });
window.__class = {g: function(){ return G; }, roll: roll};
load(); setup();
})();
</script>
</body></html>
