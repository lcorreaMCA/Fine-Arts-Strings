<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postmodernism: The Jungle of Styles (Class Game)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--bg:#e4ecd6;--surface:#fbf7e9;--ink:#1d2a1c;--muted:#4c5a45;--line:#cbd4b5;--canopy:#143d26;--moss:#2e6b3f;--leaf:#79b04a;--wood:#7a4b23;--sand:#efe2bd;--sun:#f4b52c;--orchid:#a63d7e;--accent:#2e6b3f;--jade-soft:#d6ecd0;--red:#b3263c;--red-soft:#f8dde2;--hl:#fff176;
--display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--body:"Source Serif 4",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1a10;--surface:#15261a;--ink:#e6eedc;--muted:#a9b8a0;--line:#2f4632;--accent:#8fd18a;--orchid:#e58bc0;--jade-soft:#1d3b22;--red:#ff8a9c;--red-soft:#4a1c26}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1a10;--surface:#15261a;--ink:#e6eedc;--muted:#a9b8a0;--line:#2f4632;--accent:#8fd18a;--orchid:#e58bc0;--jade-soft:#1d3b22;--red:#ff8a9c;--red-soft:#4a1c26}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.62}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.12}
h2{font-size:clamp(26px,4.2vw,38px);margin:.2em 0 .5em;color:var(--accent)}
h3{font-size:23px;color:var(--accent);margin:1.2em 0 .4em}
h4{font-size:19px;margin:.2em 0 .5em}
a{color:var(--orchid)}
p{margin:.7em 0}
.sm{font-size:16px;color:var(--muted)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:var(--canopy);color:var(--sand);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.topbar .in{max-width:900px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;font-size:15px}
.topbar .t{font-family:var(--display);color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .pbar{flex:1;height:10px;border-radius:999px;background:rgba(239,226,189,.18);overflow:hidden;min-width:60px}
.topbar .pbar i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s}
.topbar .pct{white-space:nowrap;font-weight:700}
.teacherbar{background:var(--sun);color:#1d2a1c;font-size:15px;padding:8px 18px;text-align:center;font-weight:600}
.teacherbar a{color:#1d2a1c}
/* stage */
.wrap2{max-width:900px;margin:0 auto;padding:64px 10px 30px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--canopy);border:6px solid var(--wood);box-shadow:0 10px 30px rgba(10,30,15,.35)}
.stage::before,.stage::after{content:"";position:absolute;width:min(300px,42%);aspect-ratio:1.3;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20260%20200%22%3E%3Cg%20transform%3D%22translate%28-10%2010%29%20rotate%2825%29%20scale%281.3%29%22%3E%3Cpath%20d%3D%22M0%200%20C30%20-20%2090%20-22%20130%200%20C90%2022%2030%2020%200%200Z%22%20fill%3D%22%232e6b3f%22/%3E%3Cpath%20d%3D%22M4%200%20H124%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%222%22%20opacity%3D%22.5%22/%3E%3Cpath%20d%3D%22M30%200%20l14%20-10%20M55%200%20l14%20-12%20M80%200%20l14%20-10%20M30%200%20l14%2010%20M55%200%20l14%2012%20M80%200%20l14%2010%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%221.5%22%20opacity%3D%22.35%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28-20%2060%29%20rotate%285%29%20scale%281.1%29%22%3E%3Cpath%20d%3D%22M0%200%20C30%20-20%2090%20-22%20130%200%20C90%2022%2030%2020%200%200Z%22%20fill%3D%22%233f8a46%22/%3E%3Cpath%20d%3D%22M4%200%20H124%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%222%22%20opacity%3D%22.5%22/%3E%3Cpath%20d%3D%22M30%200%20l14%20-10%20M55%200%20l14%20-12%20M80%200%20l14%20-10%20M30%200%20l14%2010%20M55%200%20l14%2012%20M80%200%20l14%2010%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%221.5%22%20opacity%3D%22.35%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%280%20-10%29%20rotate%2855%29%20scale%281.0%29%22%3E%3Cpath%20d%3D%22M0%200%20C30%20-20%2090%20-22%20130%200%20C90%2022%2030%2020%200%200Z%22%20fill%3D%22%2324593a%22/%3E%3Cpath%20d%3D%22M4%200%20H124%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%222%22%20opacity%3D%22.5%22/%3E%3Cpath%20d%3D%22M30%200%20l14%20-10%20M55%200%20l14%20-12%20M80%200%20l14%20-10%20M30%200%20l14%2010%20M55%200%20l14%2012%20M80%200%20l14%2010%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%221.5%22%20opacity%3D%22.35%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28-15%20110%29%20rotate%28-10%29%20scale%280.9%29%22%3E%3Cpath%20d%3D%22M0%200%20C30%20-20%2090%20-22%20130%200%20C90%2022%2030%2020%200%200Z%22%20fill%3D%22%232e6b3f%22/%3E%3Cpath%20d%3D%22M4%200%20H124%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%222%22%20opacity%3D%22.5%22/%3E%3Cpath%20d%3D%22M30%200%20l14%20-10%20M55%200%20l14%20-12%20M80%200%20l14%20-10%20M30%200%20l14%2010%20M55%200%20l14%2012%20M80%200%20l14%2010%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%221.5%22%20opacity%3D%22.35%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2840%20-20%29%20rotate%2880%29%20scale%280.9%29%22%3E%3Cpath%20d%3D%22M0%200%20C30%20-20%2090%20-22%20130%200%20C90%2022%2030%2020%200%200Z%22%20fill%3D%22%233f8a46%22/%3E%3Cpath%20d%3D%22M4%200%20H124%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%222%22%20opacity%3D%22.5%22/%3E%3Cpath%20d%3D%22M30%200%20l14%20-10%20M55%200%20l14%20-12%20M80%200%20l14%20-10%20M30%200%20l14%2010%20M55%200%20l14%2012%20M80%200%20l14%2010%22%20stroke%3D%22%230e2c1a%22%20stroke-width%3D%221.5%22%20opacity%3D%22.35%22/%3E%3C/g%3E%3C/svg%3E") no-repeat;background-size:contain;opacity:.9}
.stage::before{top:40px;left:0}
.stage::after{bottom:0;right:0;transform:rotate(180deg)}
.hud{position:relative;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:rgba(0,0,0,.25);border-bottom:2px solid rgba(239,226,189,.15)}
.slots{display:flex;gap:4px;flex-wrap:wrap}
.slot{width:30px;height:34px;border-radius:6px;display:grid;place-items:center;background:rgba(239,226,189,.08);border:1.5px dashed rgba(239,226,189,.4);font-size:15px;color:var(--sand)}
.slot.got{border:2px solid var(--sun);background:var(--wood);font-family:var(--display);font-size:19px;color:var(--sun)}
.hud .sp{flex:1}
.hbtn{font:600 15px var(--body);background:rgba(239,226,189,.12);color:var(--sand);border:1.5px solid rgba(239,226,189,.35);border-radius:999px;padding:5px 11px;cursor:pointer}
.hbtn:hover{background:rgba(244,181,44,.25)}
#screen{position:relative;z-index:1;min-height:520px;padding:22px 20px 26px;color:var(--sand)}
#screen.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#screen.center .lede{max-width:620px}
#screen h2{color:var(--sun)}
.stage .vine{position:absolute;z-index:3;left:0;right:0;height:52%;pointer-events:none;transition:transform .42s ease-in;background:
 repeating-linear-gradient(90deg,transparent 0 22px,rgba(20,61,38,.0) 22px 24px),
 radial-gradient(ellipse 9% 40% at 6% 0%,#2e6b3f 0 70%,transparent 71%),radial-gradient(ellipse 9% 50% at 20% 0%,#3f8a46 0 70%,transparent 71%),radial-gradient(ellipse 8% 44% at 34% 0%,#1f5532 0 70%,transparent 71%),
 radial-gradient(ellipse 9% 55% at 50% 0%,#3f8a46 0 70%,transparent 71%),radial-gradient(ellipse 8% 42% at 66% 0%,#2e6b3f 0 70%,transparent 71%),radial-gradient(ellipse 9% 52% at 80% 0%,#1f5532 0 70%,transparent 71%),radial-gradient(ellipse 9% 46% at 94% 0%,#3f8a46 0 70%,transparent 71%)}
.stage .vine.t{top:0;transform:translateY(-100%)}
.stage .vine.b{bottom:0;transform:translateY(100%) scaleY(-1)}
.stage.closing .vine.t{transform:translateY(0)}
.stage.closing .vine.b{transform:translateY(0) scaleY(-1)}
.animals{font-size:34px;letter-spacing:.2em;margin:4px 0 0}
.big{font-size:clamp(40px,8vw,78px);color:var(--sun);margin:.1em 0;text-shadow:0 4px 0 var(--wood),0 7px 0 rgba(0,0,0,.25);letter-spacing:.01em}
.lede{font-size:20px}
.date{font-style:italic;color:#cfe0b8;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.btn{font:600 16px var(--body);padding:8px 16px;border-radius:999px;border:2px solid var(--orchid);background:transparent;color:var(--orchid);cursor:pointer}
.btn:hover{background:rgba(166,61,126,.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.right{background:var(--jade-soft);border-color:var(--moss);color:var(--ink)}
.btn.wrong{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.btn.gold{background:var(--sun);border-color:var(--sun);color:#1d2a1c;font-family:var(--display);font-weight:400;font-size:18px;padding:10px 22px;box-shadow:0 4px 0 #a77412}
.btn.gold:hover{background:#ffc94d}
.btn.orchid{background:#a63d7e;border-color:#a63d7e;color:#fff;font-family:var(--display);font-weight:400;font-size:18px;padding:10px 22px;box-shadow:0 4px 0 #6b2050}
.btn.ghost{border-color:rgba(239,226,189,.6);color:var(--sand)}
.btn.ghost:hover{background:rgba(239,226,189,.1)}
.btn.ghost2{border-color:var(--line);color:var(--muted);font-size:14px}
/* speaker */
.speaker{display:flex;gap:16px;align-items:center;text-align:left;max-width:660px;margin:12px auto 0}
.speaker svg{flex:0 0 116px;width:116px;height:130px}
.bubble{background:var(--sand);color:#1d2a1c;border-radius:16px;padding:14px 18px;font-size:18px;position:relative;border:3px solid var(--wood)}
.bubble .who{font-family:var(--display);color:var(--wood);font-size:15px;display:block}
@media (max-width:600px){.speaker{flex-direction:column;text-align:center}.speaker svg{flex-basis:auto;width:92px;height:104px}}
.how{text-align:left;max-width:640px;margin:14px auto;background:rgba(0,0,0,.2);border-radius:12px;padding:12px 18px 12px 38px}
.how li{margin:.3em 0}
.how mark{color:#1d2a1c}
/* tokens */
.tokpick{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.tok{font:inherit;background:var(--sand);color:#1d2a1c;border:3px solid var(--wood);border-radius:16px;padding:10px 16px;cursor:pointer;min-width:120px;display:flex;flex-direction:column;align-items:center}
.tok .e{font-size:44px;line-height:1.1}
.tok b{font-family:var(--display);font-weight:400;font-size:18px}
.tok:hover,.tok.on{border-color:var(--sun);box-shadow:0 0 0 4px rgba(244,181,44,.45)}
/* board */
#screen.boardscr{padding:16px 14px 22px}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
@media (max-width:720px){.bwrap{grid-template-columns:1fr}}
.board{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:4px;aspect-ratio:1;padding:10px;border-radius:14px;background:#5b3a1c;border:5px solid #3e2610;box-shadow:inset 0 0 0 3px #8a5a2b}
.cell{position:relative;border-radius:8px;background:var(--sand);color:#3e2610;border:0;padding:0;font:inherit;display:block;box-shadow:inset 0 -3px 0 rgba(62,38,16,.25)}
.cell.c1{background:#e4d39f}.cell.c2{background:#cfe0a0}.cell.c3{background:#f0dfb2}
.cell .n{position:absolute;left:4px;top:1px;font-size:11px;font-weight:700;opacity:.6}
.cell.special{background:#2e6b3f;color:var(--sand);cursor:pointer;box-shadow:inset 0 0 0 3px var(--sun),inset 0 -4px 0 rgba(0,0,0,.25)}
.cell.special .si{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(16px,3.4vw,28px);opacity:.9}
.cell.special.done{background:var(--wood)}
.cell.special.done .si{font-family:var(--display);color:var(--sun);font-size:clamp(18px,3.6vw,30px)}
.cell.start{background:#a63d7e;color:#fff}
.cell.start .si{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(9px,1.7vw,14px)}
.cell .toks{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;pointer-events:none;font-size:clamp(12px,2.6vw,22px);line-height:1}
.cell .toks span{filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.cell .toks span.me{font-size:1.35em;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.heart{grid-column:3/6;grid-row:3/6;border-radius:50%;background:radial-gradient(circle,#3f8a46 0,#143d26 70%);border:4px solid var(--sun);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sand);text-align:center;position:relative;padding:6px}
.heart .hl{font-family:var(--display);font-size:clamp(11px,2vw,17px);color:var(--sun);line-height:1.1}
.heart .hc{display:flex;gap:1px;margin-top:4px;flex-wrap:nowrap;justify-content:center}
.heart .hc i{font-style:normal;width:clamp(9px,2.3vw,20px);height:clamp(13px,3vw,24px);border-radius:3px;border:1.5px solid rgba(239,226,189,.5);display:grid;place-items:center;font-family:var(--display);font-size:clamp(8px,1.8vw,15px);color:var(--sun)}
.heart .toks{position:static;display:flex;gap:2px;font-size:clamp(14px,2.6vw,22px);margin-top:2px}
.side{background:rgba(0,0,0,.24);border-radius:14px;padding:12px 14px;color:var(--sand)}
.die{width:84px;height:84px;margin:4px auto 8px;border-radius:16px;background:#fbf7e9;border:3px solid var(--wood);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;box-shadow:0 5px 0 #3e2610}
.die i{width:13px;height:13px;border-radius:50%;background:#1d2a1c;place-self:center;visibility:hidden}
.die.roll{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-14deg) scale(1.05)}50%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
.side .btn{width:100%;margin:4px 0}
.next{font-size:16px;margin:8px 0;background:rgba(239,226,189,.08);border-radius:10px;padding:8px 10px}
.next b{color:var(--sun)}
.log{font-size:14.5px;line-height:1.4;max-height:150px;overflow:auto;margin:8px 0 0;padding:0;list-style:none}
.log li{padding:3px 0;border-bottom:1px dashed rgba(239,226,189,.2)}
.standings{list-style:none;margin:6px 0 0;padding:0;font-size:15px}
.standings li{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
.standings li.me{color:var(--sun);font-weight:700}
/* journal (notes) */
#screen.notes{padding:14px 10px 20px}
.program{background:var(--surface);color:var(--ink);border-radius:12px;padding:16px 26px 22px;max-width:780px;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.2);border:2px solid var(--line);text-align:left}
@media (max-width:600px){.program{padding:12px 14px 18px}}
.program h2{color:var(--accent)!important}
.ptop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted);border-bottom:2px dotted var(--line);padding-bottom:6px;margin-bottom:6px}
.bigicon{font-size:60px;line-height:1}
.endmark{height:2px}
/* boxes */
.listen,.conn,.explorer,.discuss,.tryit,.lab{border-radius:10px;padding:12px 16px;margin:18px 0;clear:both}
.lh{font-family:var(--display);font-size:18px;margin:0 0 4px;color:var(--accent)}
.listen{background:rgba(46,107,63,.09);border:1px solid var(--moss)}
.listen .who{font-size:15px;color:var(--muted)}
.listen .lf{margin:.4em 0 0;font-weight:700;font-size:16px}
.listen ul{margin:.2em 0 .2em 1.1em;padding:0;font-size:17px}
.listen .heard{margin-top:6px}
.listen .heard.on{background:var(--jade-soft);border-color:var(--moss);color:var(--ink)}
.conn{background:rgba(244,181,44,.14);border-left:6px solid var(--sun)}
.explorer{background:var(--bg);border:1px solid var(--line)}
.explorer .card{display:none}.explorer .card.on{display:block}
.explorer .card h4{color:var(--orchid)}
.exnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.exnav .count{font-size:15px;color:var(--muted)}
.discuss{background:var(--bg);border:1px dashed var(--muted)}
.discuss p{margin:0 0 6px;font-weight:600}
.discuss textarea{width:100%;font:inherit;font-size:17px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lab{background:linear-gradient(160deg,rgba(46,107,63,.12),rgba(244,181,44,.1));border:2px solid var(--moss)}
.lab .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.lab .out{font-size:30px;letter-spacing:.08em;min-height:1.3em}
.clapgrid{display:grid;grid-template-columns:90px repeat(12,1fr);gap:3px;align-items:center;font-size:14px;max-width:560px}
.clapgrid span.d{aspect-ratio:1;border-radius:50%;background:var(--line)}
.clapgrid span.d.x{background:var(--orchid)}
.clapgrid span.d.x.b{background:var(--moss)}
.clapgrid span.d.now{outline:3px solid var(--sun)}
.sil{font-family:var(--display);font-size:40px;color:var(--accent);margin:4px 0}
/* comic figure */
.fig{margin:16px 0}
.fig .imgwrap{position:relative;display:block;max-width:440px;margin:0 auto}
.fig svg.art{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 4px 14px rgba(20,40,20,.25)}
.fig figcaption{font-size:15px;color:var(--muted);margin-top:6px;text-align:center}
.hot{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer}
.hot span{position:absolute;inset:6px;border-radius:50%;background:var(--sun);animation:glow 1.8s infinite;border:2px solid #fff}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(244,181,44,.85)}70%{box-shadow:0 0 0 14px rgba(244,181,44,0)}100%{box-shadow:0 0 0 0 rgba(244,181,44,0)}}
.hotfact{position:absolute;z-index:5;max-width:260px;background:var(--sand);color:#1d2a1c;border:2px solid var(--wood);border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.3)}
/* try it */

<template id="tpl-scene">
<p id="scene-1">World War II ended in 1945, and the world began changing fast again. By the end of the 1950s, most American homes had a television. Records, radio, and later music videos carried songs around the planet. The Cold War, the space race, the civil rights movement, and the first computers all shaped the second half of the 20th century.</p>
<p id="scene-2">In the last lesson you met the modernists. They believed in progress: each new style should replace the old one, and serious art should stay far away from popular entertainment. By the 1960s, many younger artists stopped believing there was one “right” path forward. Their new attitude is called <b>postmodernism</b>, which means “after modernism.”</p>
<p id="scene-3">Postmodern artists loved to <b>mix old and new styles</b> in one work. They blurred the line between <b>“high” art</b> (museums, concert halls, opera) and <b>popular culture</b> (ads, comics, pop songs, TV). They used humor and <b>irony</b>, saying one thing while meaning another, and they kept asking, “Who decides what counts as art?” Instead of one style, there were many at the same time. This is called <b>pluralism</b>. Think of a jungle, where every kind of plant grows at once.</p>
<p id="scene-4">Architecture shows the change most clearly. The modernist architect <b>Ludwig Mies van der Rohe</b> designed plain towers of glass and steel and summed up his style in three words: “less is more.” In 1966, the American architect <b>Robert Venturi</b> answered with a joke: “<b>Less is a bore</b>.” Postmodern buildings brought back columns, arches, bright colors, and decoration, often with a wink.</p>
<p id="scene-5">You can visit a famous postmodern landmark right here in New Orleans. The <b>Piazza d’Italia</b> (1978), designed by <b>Charles Moore</b>, honors the city’s Italian American community. It borrows columns and arches from ancient Rome but builds them from <b>stainless steel and neon lights</b>. A fountain is shaped like the boot of Italy, and because most of the city’s Italian families came from Sicily, the island sits at the center of the plaza.</p>
<p id="scene-6">In music, composers after 1945 took <b>three main paths</b>. Some wanted <b>total control</b> over every sound, using strict mathematical systems and the new electronic studios. Others gave control away and let <b>chance</b> decide, which later led to minimalism. A third group turned <b>back to the past</b>, mixing old styles with new ones and returning to emotional, tonal music. That last path is sometimes called <b>neo-romanticism</b>. You will meet all three paths in this jungle.</p>
<div class="explorer" data-k="timeline"><p class="lh">🔍 Click through a timeline of the postmodern age</p><div class="cards">
<div class="card" data-i="0"><h4>1945</h4><p>World War II ends. Many European artists now live in the United States, and New York becomes a world capital of the arts.</p></div>
<div class="card" data-i="1"><h4>1952</h4><p>John Cage’s “silent” piece <i>4′33″</i> is performed for the first time.</p></div>
<div class="card" data-i="2"><h4>1953</h4><p>Samuel Beckett’s play <i>Waiting for Godot</i> opens in Paris.</p></div>
<div class="card" data-i="3"><h4>1962</h4><p>Andy Warhol shows his soup-can paintings, and young dancers start the Judson Dance Theater in New York.</p></div>
<div class="card" data-i="4"><h4>1964</h4><p>Terry Riley writes <i>In C</i>, an early minimalist piece.</p></div>
<div class="card" data-i="5"><h4>1969</h4><p>Astronauts walk on the Moon while millions watch on live TV.</p></div>
<div class="card" data-i="6"><h4>1973</h4><p>A party in the Bronx, New York, marks the birth of hip-hop.</p></div>
<div class="card" data-i="7"><h4>1978</h4><p>The Piazza d’Italia opens in New Orleans.</p></div>
<div class="card" data-i="8"><h4>1981</h4><p>MTV starts playing music videos around the clock, and Laurie Anderson’s <i>O Superman</i> becomes a surprise hit.</p></div>
<div class="card" data-i="9"><h4>1989</h4><p>The Berlin Wall falls, and the Cold War soon ends.</p></div>

<template id="tpl-cage">
<p id="cage-1"><b>John Cage</b> (1912–1992), from Los Angeles, asked huge questions: What is music? What is silence? In the 1940s he invented the <b>prepared piano</b>. He placed screws, bolts, and pieces of rubber between the piano’s strings, so each key sounded like a small drum, gong, or rattle.</p>
<p id="cage-2">In 1951, Cage visited an <b>anechoic chamber</b> at Harvard University, a room built to absorb every sound. He expected perfect silence, but he heard two sounds, one high and one low. The engineer told him the high sound was his nervous system and the low one was his blood circulating. Cage decided there is no such thing as true silence.</p>
<p id="cage-3">On August 29, 1952, in Woodstock, New York, the pianist <b>David Tudor</b> sat at a piano and played nothing at all for four minutes and thirty-three seconds. He only closed and opened the keyboard lid to show the start and end of three movements. In Cage’s piece <b>4′33″</b>, the music is <b>every sound in the room</b>: wind, rain on the roof, coughs, and whispers. Some listeners were furious and walked out.</p>
<p id="cage-4">Cage also composed with <b>chance</b>. For <i>Music of Changes</i> (1951) he tossed coins and used the <b><i>I Ching</i></b>, an ancient Chinese book, to choose the notes, their lengths, and how loud they would be. He wanted to get his own likes and dislikes out of the way. Music made this way is called <b>chance music</b> or <b>aleatory music</b>, from <i>alea</i>, the Latin word for dice.</p>
<div class="lab chance"><p class="lh">🎲 Lab: Roll a chance melody</p><p class="sm">Like Cage, let the dice choose. Each roll picks a note: ⚀ C, ⚁ D, ⚂ E, ⚃ G, ⚄ A, ⚅ high C.</p><div class="row"><button type="button" class="btn croll">Roll six dice and play</button></div><p class="out" aria-live="polite"></p></div>
<p id="cage-5">Cage’s partner, the choreographer <b>Merce Cunningham</b> (1919–2009), brought chance into dance. He tossed coins to decide the order of the steps or where each dancer would stand. Cage and Cunningham often created the music and the dance separately, and the two met for the first time at the performance. The painter <b>Robert Rauschenberg</b> designed sets and costumes for them. His all-white paintings of 1951, which show only shadows and dust, helped inspire <i>4′33″</i>. In 1952, at Black Mountain College in North Carolina, Cage also staged <i>Theater Piece No. 1</i>, with music, dance, poetry, and paintings all happening at once. Mixed events like this were later called <b>happenings</b>.</p>
<p id="cage-6">Other composers chose the opposite path: <b>total control</b>. Schoenberg’s twelve-tone system had organized the notes; now composers such as <b>Pierre Boulez</b> in France and <b>Milton Babbitt</b> in the United States used number systems to control rhythm and loudness too. This is called <b>total serialism</b>. The new electronic studios gave even more control. From the 1950s, composers cut and spliced magnetic tape to build new sounds, and later used <b>synthesizers</b>. Babbitt’s <i>Philomel</i> (1964) combines a live soprano, her own recorded voice on tape, and synthesized sound. Strangely, a page of total control and a page of pure chance can look almost alike.</p>
<div class="explorer" data-k="cagefacts"><p class="lh">🔍 Strange but true: Cage facts</p><div class="cards">
<div class="card" data-i="0"><h4>Mushroom champion</h4><p>Cage was an expert on wild mushrooms. In 1959 he won a big cash prize on an Italian TV quiz show by answering questions about them.</p></div>
<div class="card" data-i="1"><h4>Water Walk</h4><p>On TV in 1960, Cage performed <i>Water Walk</i> using a bathtub, a pressure cooker, a rubber duck, and five radios. The audience laughed, and Cage said he preferred laughter to tears.</p></div>
<div class="card" data-i="2"><h4>The slowest concert</h4><p>A church organ in Halberstadt, Germany, is playing Cage’s <i>As Slow As Possible</i>. The performance began in 2001 and is planned to end in 2640.</p></div>
</div><div class="exnav"><button type="button" class="btn prev">← Back</button><span class="count"></span><button type="button" class="btn next">Next →</button></div></div>
<div class="listen" data-k="cage"><p class="lh">🎧 Watch a performance</p><p><a href="https://www.youtube.com/results?search_query=John+Cage+4%2733+performance+orchestra" target="_blank" rel="noopener">John Cage: 4′33″ performed by a full orchestra</a> <span class="who">about 5 minutes</span></p><p class="lf">Watch and listen for:</p><ul><li>how the performers show when each movement starts and ends</li><li>the sounds the audience makes without meaning to</li><li>how the audience reacts at the very end</li></ul><button type="button" class="btn heard">I watched it</button></div>

<template id="tpl-mini">
<p id="mini-1">Some young composers found modernist music, like Schoenberg’s twelve-tone pieces, too complicated. In the 1960s they started <b>minimalism</b>: music built from <b>a few simple patterns repeated many times, changing slowly</b>. Listening to it is like watching a river. It seems to stay the same, but it is always moving.</p>
<p id="mini-2"><b>Terry Riley</b>’s <i>In C</i> (1964) has <b>53 short phrases</b>, and any group of instruments can play it. A steady <b>pulse of repeated Cs</b> on the piano holds everyone together, while each player decides when to move on to the next phrase. No two performances of <i>In C</i> sound alike.</p>
<p id="mini-3"><b>Steve Reich</b> (born 1936) discovered <b>phasing</b> by accident in 1965. He played two tape loops of a street preacher in San Francisco saying “<b>It’s gonna rain</b>.” The two machines ran at slightly different speeds, so the loops slowly drifted apart, creating new rhythms. In <i>Clapping Music</i> (1972), two performers clap the same <b>12-beat pattern</b>. One keeps it steady; after a group of repeats, the other jumps ahead by one beat. After 12 jumps, the two line up again. Reich also studied drumming in Ghana, West Africa, in 1970.</p>
<div class="lab clap"><p class="lh">👏 Lab: Clapping Music</p><p class="sm">Pink dots are Clapper 1 (steady). Green dots are Clapper 2. Press Play, then press Shift to move Clapper 2 ahead by one beat. Listen to the new rhythms appear.</p><div class="clapgrid" aria-hidden="true"></div><div class="row"><button type="button" class="btn cplay">▶ Play</button><button type="button" class="btn cshift">Shift Clapper 2</button><span class="cinfo sm">Shift 0 of 12</span></div></div>
<p id="mini-4"><b>Philip Glass</b> (born 1937) builds music from repeated <b>arpeggios</b> (the notes of a chord played one at a time) that grow by adding and subtracting notes. His opera <b><i>Einstein on the Beach</i></b> (1976), made with the director <b>Robert Wilson</b>, has no story, lasts almost <b>five hours</b> with no intermission, and lets the audience come and go as they please. Glass later wrote many film scores.</p>
<p id="mini-6"><i>Einstein on the Beach</i> was the first of three “portrait” operas by Glass about people who changed the world, followed by <i>Satyagraha</i> (1980), about Gandhi, and <b><i>Akhnaten</i></b> (1984), about the ancient Egyptian pharaoh who replaced Egypt’s many gods with one god, the sun. The opera is sung in ancient languages. In a recent production at the Metropolitan Opera in New York, the lead was sung by the <b>countertenor</b> Anthony Roth Costanzo, a man who sings in a high range usually sung by women. Everyone onstage moves in extreme slow motion, twelve <b>jugglers</b> keep time with Glass’s repeating patterns, and in one scene the singers sing only the sound “ah” for about six minutes.</p>
<p id="mini-5">Minimalism began in visual art at the same time. <b>Donald Judd</b> made rows of identical metal boxes, and the painter <b>Frank Stella</b> said of his stripe paintings, “<b>What you see is what you see</b>.” Minimalist music later spread into pop songs, movie soundtracks, and video games.</p>

<template id="tpl-pop">
<p id="pop-1">By the late 1950s, ads, comic books, television, and supermarket shelves were everywhere. <b>Pop Art</b> brought these <b>everyday images</b> into the museum. In 1956, the British artist <b>Richard Hamilton</b> made a collage of magazine ads that shows a bodybuilder holding a giant lollipop with the word “POP” on it.</p>
<p id="pop-0">Pop Art was also a rebellion inside the art world. In the 1940s and 1950s, the powerful critic <b>Clement Greenberg</b> had championed <b>Abstract Expressionism</b>, like Jackson Pollock’s drip paintings. Greenberg believed painting should be “pure”: flat, about paint and color, with no stories and no everyday images. That idea is called <b>formalism</b>. Pop artists broke all of its rules at once.</p>
<p id="pop-2"><b>Andy Warhol</b> (1928–1987) began as an artist for advertisements. In 1962 he showed <b>32 paintings of soup cans</b>, one for each flavor sold by the Campbell’s company. He used <b>silkscreen</b> printing to repeat images of soup cans, dollar bills, and movie stars, and he called his studio <b>“The Factory.”</b> Making art the way a factory makes products was exactly the point. In 1964 he showed <i>Brillo Boxes</i>, wooden boxes painted to look exactly like boxes of soap pads at the grocery store. The philosopher <b>Arthur Danto</b> said that after this, you could no longer tell art from an ordinary object just by looking. To know it was art, you had to know the ideas around it.</p>
<p id="pop-3"><b>Roy Lichtenstein</b> (1923–1997) painted giant versions of single comic-book frames, complete with speech balloons and the tiny <b>Ben-Day dots</b> that cheap printing used to make color. Critics asked whether copying a comic could ever be art, and that question was part of the art.</p>

<p id="pop-4">Pop Art and pop music met often. Warhol managed the rock band <b>the Velvet Underground</b> and designed the banana on their first album cover (1967). The artists <b>Peter Blake</b> and <b>Jann Haworth</b> built the crowded collage on the cover of the Beatles’ album <i>Sgt. Pepper’s Lonely Hearts Club Band</i> (1967). Album covers became a new kind of art gallery.</p>
<p id="pop-5">Women Pop artists were often left out of the history books. <b>Marisol</b> (Marisol Escobar) carved witty wooden sculptures of families and celebrities, and <b>Rosalyn Drexler</b> painted scenes from movies and pro wrestling. <b>Yayoi Kusama</b>, who came to New York from Japan, covered canvases, objects, and even people with <b>polka dots</b> and built mirror rooms that seem to go on forever.</p>
<p id="pop-6">Abstract art had almost erased the human figure. Postmodern artists brought the <b>body</b> back as a subject. <b>Kara Walker</b> cuts huge black paper silhouettes, based on old illustrations, to confront the history of slavery. <b>Felix Gonzalez-Torres</b> made a portrait of his partner Ross as a pile of wrapped candy weighing 175 pounds, Ross’s healthy weight. Visitors may take a piece, so the portrait slowly shrinks, and then it is refilled.</p>

<template id="tpl-collage">
<p id="col-1">Painters had glued scraps of paper into <b>collages</b> since Picasso. Postmodern composers made <b>musical collages</b>. They <b>quoted</b> other music, from Bach to the Beatles, sometimes several pieces at once. A <b>quotation</b> in music is a passage borrowed from another piece. A <b>pastiche</b> is a work that imitates or mixes the styles of earlier works.</p>
<p id="col-2">The Italian composer <b>Luciano Berio</b> (1925–2003) wrote <i>Sinfonia</i> (1968–69) for orchestra and <b>eight amplified voices</b>. In its third movement, a whole movement of a Gustav Mahler symphony keeps playing underneath, while bits of Bach, Beethoven, Debussy, Stravinsky, and many others float in and out. Over it all, the singers speak and whisper words by the playwright <b>Samuel Beckett</b>.</p>
<p id="col-3">Other composers went back to old styles on purpose. The American <b>George Rochberg</b> shocked his colleagues with his String Quartet No. 3 (1972), which sounds partly like Beethoven. The Russian <b>Alfred Schnittke</b> mixed baroque, classical, tango, and harsh modern sounds in one piece and called it <b>polystylism</b>, “many styles.” Music like this, which turns back to the emotional, tonal sound of the 1800s, is often called <b>neo-romanticism</b>.</p>
<div class="lab collage"><p class="lh">✂️ Lab: Build a musical collage</p><p class="sm">Turn on layers, then press Play to hear them all at once. Each layer is a well-known tune or beat.</p><div class="row"><button type="button" class="btn layer" data-l="ode" aria-pressed="false">Beethoven: Ode to Joy</button><button type="button" class="btn layer" data-l="min" aria-pressed="false">Petzold: Minuet in G</button><button type="button" class="btn layer" data-l="brk" aria-pressed="false">A drum “break”</button></div><div class="row"><button type="button" class="btn gplay">▶ Play my collage</button></div></div>
<p id="col-4">Collage also grew out of the street. On August 11, 1973, at a back-to-school party at 1520 Sedgwick Avenue in <b>the Bronx</b>, New York, <b>DJ Kool Herc</b> used <b>two turntables</b> to repeat the <b>“break,”</b> the drum part of funk records, so dancers could keep moving. That party is remembered as the birth of <b>hip-hop</b>. Later, producers used <b>sampling</b>: borrowing short recorded pieces of older songs to build new ones.</p>
<p id="col-5">In visual art, Robert Rauschenberg glued newspapers, photos, and real objects onto his paintings and called them <b>“combines.”</b> In <i>Monogram</i> (1955–59), a stuffed goat with a car tire around its middle stands on a painted panel. Collage, quotation, and sampling all ask the same question: can you make something new out of things that already exist?</p>
<p id="col-6">Some artists went further and borrowed whole works. This is called <b>appropriation</b>. In 1981, <b>Sherrie Levine</b> photographed a famous 1930s photograph by Walker Evans and showed it under her own name, as <i>After Walker Evans</i>. She was asking what makes a work “original,” and why the famous names in art history were almost always men.</p>

<template id="tpl-bells">
<p id="bell-1">While some composers piled styles on top of each other, others went back to the simplest materials: one chord, a slow melody, and silence. Several of them were inspired by religious faith, so critics nicknamed them the <b>holy minimalists</b>, even though their music is not built from repeated patterns like Reich’s.</p>
<p id="bell-2"><b>Arvo Pärt</b> (born 1935) is from Estonia, which was then part of the Soviet Union. In the early 1970s he almost stopped composing for several years and studied <b>medieval chant</b>. In 1976 he found a new style he called <b>tintinnabuli</b>, from the Latin word for “little bells.” <b>One voice moves step by step through a melody</b>, while <b>a second voice sounds only the notes of one chord</b>, ringing like a bell. <i>Spiegel im Spiegel</i> (“Mirror in the Mirror,” 1978) for <b>violin and piano</b> is a famous example. In 1980, Pärt left the Soviet Union with his family.</p>
<div class="lab tinti"><p class="lh">🔔 Lab: Hear tintinnabuli</p><p class="sm">The melody voice walks up and down the scale. The bell voice plays only A, C, and E, the notes of one chord. Hear each voice alone, then together.</p><div class="row"><button type="button" class="btn tp" data-v="m">Melody voice</button><button type="button" class="btn tp" data-v="t">Bell voice</button><button type="button" class="btn tp" data-v="mt">Both together</button></div></div>
<p id="bell-3">The Polish composer <b>Henryk Górecki</b> (1933–2010) wrote his Symphony No. 3, the <i>Symphony of Sorrowful Songs</i> (1976), for soprano and orchestra. Its second movement sets a <b>prayer written on the wall of a prison cell</b> during World War II by an 18-year-old girl named Helena Błażusiakówna. In 1992, a new recording with the American soprano <b>Dawn Upshaw</b> <b>sold more than a million copies</b>, a rare classical hit on the pop charts.</p>
<p id="bell-4">These composers showed that new music did not have to be difficult. Slow, simple, beautiful music could be postmodern too, because it rejected the modernist idea that music must keep getting more complicated. Their works are often heard in films.</p>
<p id="bell-5">The Russian composer <b>Sofia Gubaidulina</b> (born 1931), another deeply spiritual Soviet-era composer, borrowed the past in a different way. Her violin concerto <i>Offertorium</i> (1980) begins with a famous theme by Bach from <i>The Musical Offering</i>, then takes it apart one note at a time. Near the end, the theme returns, rebuilt backward.</p>
<div class="listen" data-k="bells"><p class="lh">🎧 Listen to an example</p><p><a href="https://www.youtube.com/results?search_query=Arvo+P%C3%A4rt+Spiegel+im+Spiegel+violin+piano" target="_blank" rel="noopener">Arvo Pärt: <i>Spiegel im Spiegel</i></a> <span class="who">listen to the first 3 minutes</span></p><p class="lf">Listen for:</p><ul><li>the piano’s gentle broken chords that never stop</li><li>the violin’s slow melody, moving one step at a time</li><li>how the melody keeps returning to the same note, like a mirror</li></ul><button type="button" class="btn heard">I listened</button></div>

<template id="tpl-women">
<p id="wom-1">For centuries, women composers struggled to get their music performed. In the second half of the 20th century, women became leaders of new music, and many invented completely new ways to make and hear sound.</p>
<p id="wom-2"><b>Pauline Oliveros</b> (1932–2016) was a pioneer of electronic music. She created <b>Deep Listening</b>, a practice of <b>listening to every sound around you</b>, near and far. In 1988 she and two friends recorded an album <b>inside a huge, empty underground water tank</b> (a cistern) in Washington State, where every sound echoes for about 45 seconds.</p>
<div class="lab cistern"><p class="lh">🌊 Lab: Play a note in the cistern</p><p class="sm">Press the button and listen to how long the sound lingers in a giant echoing space.</p><div class="row"><button type="button" class="btn cis" data-n="57">Low note</button><button type="button" class="btn cis" data-n="64">Middle note</button><button type="button" class="btn cis" data-n="71">High note</button></div></div>
<p id="wom-3"><b>Meredith Monk</b> (born 1942) is a composer, singer, director, and choreographer. She uses the voice like a whole orchestra, with cries, clicks, hums, and wordless chants. These are called <b>extended vocal techniques</b>. You can hear them in <i>Dolmen Music</i> (1979).</p>
<p id="wom-4"><b>Laurie Anderson</b> (born 1947) mixes music, storytelling, and technology in <b>performance art</b>. She invented a <b>tape-bow violin</b>, which plays recorded words instead of strings. Her eight-minute song <i>O Superman</i> (1981), sung through an electronic voice effect, reached <b>number 2</b> on the British pop charts.</p>
<p id="wom-5">In 1983, <b>Ellen Taaffe Zwilich</b> became the <b>first woman to win the Pulitzer Prize for Music</b>, for her Symphony No. 1. <b>Joan Tower</b> answered <b>Aaron Copland</b>’s famous <i>Fanfare for the Common Man</i> (1942) with her own <i>Fanfare for the Uncommon Woman</i> (1986), dedicated to women who take risks. <b>Chen Yi</b> (born 1953), who moved from China to the United States, blends Chinese folk songs and traditional harmonies with Western orchestras.</p>
<p id="wom-6">Women also led in visual art. <b>Judy Chicago</b>’s <i>The Dinner Party</i> (1974–79) is a giant triangular table with <b>39 place settings</b>, each honoring a woman from history. <b>Cindy Sherman</b> photographed herself in costume as made-up movie heroines in her <i>Untitled Film Stills</i> (1977–80), asking how movies shape the way we see women. <b>Barbara Kruger</b> pasted bold red-and-white words over black-and-white photos, like an ad that talks back, and <b>Jenny Holzer</b> put short, surprising sentences on electronic signs in public places.</p>

<p id="stage-1">Theater took a strange turn. In Samuel Beckett’s <i>Waiting for Godot</i> (Paris, 1953), two tramps named Vladimir and Estragon wait beside a bare tree for someone called <b>Godot, who never arrives</b>. Almost nothing happens, twice. In 1961 the critic Martin Esslin named this style the <b>Theatre of the Absurd</b>: plays that show life as strange, funny, and pointless all at once. The word comes from the Latin <i>absurdus</i>, which means “out of tune.”</p>
<p id="stage-5">Absurdist plays grew out of the confusion and fear that followed World War II. They use <b>circular dialogue</b> (conversations that go nowhere), bare sets, a mix of comedy and tragedy, and sometimes <b>break the fourth wall</b>, when actors speak straight to the audience. Other famous examples are Eugène Ionesco’s <i>The Bald Soprano</i> (1950) and <i>Rhinoceros</i> (1959), in which people turn into rhinoceroses one by one, and Harold Pinter’s <i>The Dumb Waiter</i> (1960). Earlier, the German playwright <b>Bertolt Brecht</b> had created <b>epic theater</b>, which keeps reminding the audience that they are watching a play so they will think about society. His <i>Threepenny Opera</i> (1928), with music by Kurt Weill, still influences theater today.</p>
<p id="stage-2">In 1962, young dancers began giving concerts at <b>Judson Memorial Church</b> in New York’s Greenwich Village. The <b>Judson Dance Theater</b> made <b>postmodern dance</b> out of <b>ordinary movement</b>: walking, running, sitting, even eating. <b>Yvonne Rainer</b>’s “No Manifesto” (1965) said no to spectacle, glamour, and showing off. In 1970, <b>Trisha Brown</b> had a dancer in a harness <b>walk down the side of a building</b>.</p>
<p id="stage-3">In Germany, <b>Pina Bausch</b> (1940–2009) led the Tanztheater Wuppertal from 1973, mixing dance and theater into <b>dance theater</b>. In <i>Café Müller</i> (1978), dancers with their eyes closed stumble through a room crowded with <b>chairs</b>, while another performer rushes to push the chairs out of their way.</p>
<p id="stage-6">Concert dance mixed styles, too. <b>Alvin Ailey</b>’s <i>Revelations</i> (1960) sets modern dance to African American spirituals and gospel songs. <b>Twyla Tharp</b>’s <i>Deuce Coupe</i> (1973) put ballet dancers and street-style dancers together onstage to songs by the Beach Boys. In Japan, <b>Butoh</b> began in 1959: dancers, often painted white, move very slowly to show strong and dark feelings.</p>
<p id="stage-4">Opera changed too. In 1945, Benjamin Britten’s <i>Peter Grimes</i> launched a new age of British opera. <i>Einstein on the Beach</i> starred the Judson dancer <b>Lucinda Childs</b>, who later created dances for it. <b>John Adams</b>’s <i>Nixon in China</i> (1987) turned a recent news event, President Richard Nixon’s 1972 visit to China, into an opera with minimalist-style music.</p>
<div class="listen" data-k="stage"><p class="lh">🎬 Watch an example</p><p><a href="https://www.youtube.com/results?search_query=Trisha+Brown+Man+Walking+Down+the+Side+of+a+Building" target="_blank" rel="noopener">Trisha Brown: <i>Man Walking Down the Side of a Building</i></a> <span class="who">about 2 minutes</span></p><p class="lf">Watch for:</p><ul><li>an ordinary walk turned into a dance</li><li>how the building becomes the stage</li><li>the faces of the people watching from the street</li></ul><button type="button" class="btn heard">I watched it</button></div>

<div><dt>Aleatory music (chance music)</dt><dd>Music in which some choices are left to chance, such as tossing coins or rolling dice.</dd></div>
<div><dt>Appropriation</dt><dd>Borrowing a whole existing image or work and presenting it in a new context, as Sherrie Levine did.</dd></div>
<div><dt>Anechoic chamber</dt><dd>A room built to absorb every sound, with no echoes.</dd></div>
<div><dt>Arpeggio</dt><dd>The notes of a chord played one at a time instead of together.</dd></div>
<div><dt>Ben-Day dots</dt><dd>Tiny dots of a few ink colors that cheap printing used to make many colors; copied by Roy Lichtenstein.</dd></div>
<div><dt>Break</dt><dd>The part of a song where only the drums (and sometimes bass) play; DJs repeated it in early hip-hop.</dd></div>
<div><dt>Collage</dt><dd>A work made by putting together pieces of other things, such as paper, photos, objects, or bits of music.</dd></div>
<div><dt>Butoh</dt><dd>A Japanese dance form begun in 1959, with very slow movement and dancers often painted white.</dd></div>
<div><dt>Circular dialogue</dt><dd>Conversation in a play that goes around and around without getting anywhere.</dd></div>
<div><dt>Combine</dt><dd>Robert Rauschenberg’s name for his mix of painting, collage, and real objects.</dd></div>
<div><dt>Countertenor</dt><dd>A man who sings in a high range usually sung by women.</dd></div>
<div><dt>Dance theater (Tanztheater)</dt><dd>A mix of dance and theater, as in the work of Pina Bausch.</dd></div>
<div><dt>Deep Listening</dt><dd>Pauline Oliveros’s practice of listening to every sound around you, near and far.</dd></div>
<div><dt>Epic theater</dt><dd>Bertolt Brecht’s style of theater, which reminds the audience it is watching a play so it will think about society.</dd></div>
<div><dt>Extended vocal techniques</dt><dd>New ways of using the voice, such as cries, clicks, hums, and wordless chants.</dd></div>
<div><dt>Formalism</dt><dd>The idea, championed by Clement Greenberg, that art should be judged only by its form (color, shape, flatness), not its story or subject.</dd></div>
<div><dt>Fourth wall</dt><dd>The invisible wall between the stage and the audience; actors “break” it when they speak straight to the audience.</dd></div>
<div><dt>Happening</dt><dd>An art event that mixes music, dance, art, and the audience, often with chance, like Cage’s <i>Theater Piece No. 1</i> (1952).</dd></div>
<div><dt>Hip-hop</dt><dd>A style of music and culture born in the Bronx, New York, in the 1970s, built on DJs, rapping, breaking (dance), and graffiti.</dd></div>
<div><dt>Holy minimalism</dt><dd>A nickname for the slow, simple, often spiritual music of composers such as Arvo Pärt and Henryk Górecki.</dd></div>
<div><dt>Irony</dt><dd>Saying or showing one thing while meaning something different, often with humor.</dd></div>
<div><dt>Minimalism</dt><dd>Music (or art) built from a few simple patterns repeated many times, changing slowly.</dd></div>
<div><dt>Neo-romanticism</dt><dd>Music after 1945 that returns to the emotional, tonal sound of the 1800s.</dd></div>
<div><dt>Pastiche</dt><dd>A work that imitates or mixes the styles of earlier works.</dd></div>
<div><dt>Performance art</dt><dd>Live art that mixes music, storytelling, movement, and often technology.</dd></div>
<div><dt>Phasing</dt><dd>Two copies of the same pattern slowly drifting out of step, creating new rhythms.</dd></div>
<div><dt>Pluralism</dt><dd>Many styles existing at the same time, with none of them the “right” one.</dd></div>
<div><dt>Polystylism</dt><dd>Alfred Schnittke’s word for mixing many styles in one piece of music.</dd></div>
<div><dt>Pop Art</dt><dd>Art that uses everyday images from ads, comics, products, and celebrities.</dd></div>
<div><dt>Postmodern dance</dt><dd>Dance made from ordinary movement, such as walking, running, and sitting, begun by the Judson Dance Theater.</dd></div>
<div><dt>Postmodernism</dt><dd>“After modernism”: art from about 1945 to 2000 that mixes styles, blurs high art and popular culture, and asks who decides what art is.</dd></div>
<div><dt>Prepared piano</dt><dd>A piano with screws, bolts, or rubber placed between its strings to change its sound, invented by John Cage.</dd></div>
<div><dt>Quotation</dt><dd>A passage of music borrowed from another piece.</dd></div>
<div><dt>Sampling</dt><dd>Borrowing short recorded pieces of older songs to build new ones.</dd></div>
<div><dt>Silkscreen</dt><dd>A printing method that pushes ink through a fine screen; Andy Warhol used it to repeat images.</dd></div>
<div><dt>Synthesizer</dt><dd>An electronic instrument that creates sounds from electrical signals.</dd></div>
<div><dt>Tape loop</dt><dd>A piece of recording tape joined end to end so a sound repeats over and over.</dd></div>
<div><dt>Total serialism</dt><dd>Using number systems to control not only the notes but also rhythm and loudness, as Boulez and Babbitt did.</dd></div>
<div><dt>Theatre of the Absurd</dt><dd>Plays, such as <i>Waiting for Godot</i>, that show life as strange, funny, and pointless all at once.</dd></div>
<div><dt>Tintinnabuli</dt><dd>Arvo Pärt’s style, from the Latin for “little bells”: one voice moves through a melody while another plays only the notes of one chord.</dd></div>
</template>

<script>
(function(){
var L = window.LESSON, stops = L.stops, END = L.end, KEY = "jungle-postmodernism-class-v1";
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function rnd(n){ return 1 + Math.floor(Math.random() * n); }
var TEAMS = [{e: "🐆", n: "Jaguars", c: "#e08a1e"}, {e: "🐘", n: "Elephants", c: "#5b7fd6"}, {e: "🐒", n: "Monkeys", c: "#b5651d"}, {e: "🐊", n: "Crocodiles", c: "#2e9e5b"}];

/* ---------- state ---------- */

function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
function fresh(names){ return {teams: TEAMS.map(function(t, k){ return {k: k, name: names[k] || "The " + t.n, pos: 0, done: {}, right: 0, wrong: 0, at: 0, asked: {}}; }), turn: 0, rolls: 0, log: [], arrive: [], pw: false, q: null}; }
function T(t){ return TEAMS[t.k]; }
function cur(){ return st.teams[st.turn]; }
function nextStopFor(t){ for (var i = 0; i < stops.length; i++) if (!t.done[stops[i].id]) return stops[i]; return null; }
function onStop(t){ var i = SQ[t.pos]; return i !== undefined && !t.done[stops[i].id] ? stops[i] : null; }

/* ---------- sound ---------- */
var ac = null, soundOn = true;
function tone(notes, dur, type, gap, vol){ if (!soundOn) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume();
  notes.forEach(function(n, k){ var t = ac.currentTime + 0.02 + k * gap, o = ac.createOscillator(), g = ac.createGain(); o.type = type || "triangle"; o.frequency.value = 440 * Math.pow(2, (n - 69) / 12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05); }); } catch(e){} }
var sGood = function(){ tone([67,71,74,79], 0.18, "triangle", 0.08); }, sBad = function(){ tone([50,49,48], 0.35, "sawtooth", 0.12); },
    sWin = function(){ tone([60,64,67,72,76,79,84], 0.3, "triangle", 0.1); }, sStep = function(){ tone([84], 0.05, "square", 0, 0.03); };
$("#soundBtn").onclick = function(){ soundOn = !soundOn; this.textContent = soundOn ? "🔊" : "🔈"; this.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off"); };

/* ---------- screens ---------- */
var screen = $("#screen"), stage = $("#stage"), view = "setup", busy = false;
function show(html, after, cls){ stage.classList.add("closing");
  setTimeout(function(){ screen.innerHTML = html; screen.className = cls || ""; if (after) after(); stage.classList.remove("closing"); hud(); }, RM ? 0 : 380); }
function on(id, fn){ var el = document.getElementById(id); if (el) el.onclick = fn; }
function hud(){ if (!st){ $("#pfill").style.width = "0"; $("#pct").textContent = "4 teams"; return; }
  var best = Math.max.apply(null, st.teams.map(function(t){ return Object.keys(t.done).length; }));
  $("#pfill").style.width = (best / 8 * 100) + "%"; $("#pct").textContent = "Leader: " + best + " of 8 letters"; }

function setup(){ view = "setup";
  show('<p class="date">Classroom team game · about 1945–2000</p><h1 class="big">The Jungle<br>of Styles</h1><p class="lede">Four teams race through the jungle. Name your teams, then open the board.</p>' +
    '<div class="setup">' + TEAMS.map(function(t, k){ return '<label style="--c:' + t.c + '"><span class="e" aria-hidden="true">' + t.e + '</span>Team ' + (k + 1) + '<input id="tn' + k + '" value="The ' + t.n + '" maxlength="24"></label>'; }).join("") + "</div>" +
    '<ol class="how"><li>Teams take turns rolling the die. Press <b>Roll</b> or the space bar.</li><li>The eight green squares are challenge squares. A team that reaches one stops there, even if it rolled more.</li><li>The team answers one question. Use the buttons or keys 1, 2, 3. A right answer wins that square’s letter of the password.</li><li>A wrong answer slides the team <b>back 3 squares</b>, and the whole class reads the part of the field notes that holds the answer.</li><li>The first team to collect all eight letters, reach the heart of the jungle, and shout the password wins.</li></ol>' +
    '<div class="btns">' + (st ? '<button class="btn ghost" id="resume">Resume the saved game</button>' : "") + '<button class="btn gold" id="go">Start a new game</button></div>',
    function(){ on("go", function(){ var names = TEAMS.map(function(_, k){ return ($("#tn" + k).value || "").trim(); }); st = fresh(names); save(); board(); }); on("resume", board); }, "center"); }

var COORD = (function(){ var c = [], r, k;
  for (k = 0; k <= 6; k++) c.push([6, k]); for (r = 5; r >= 0; r--) c.push([r, 6]); for (k = 5; k >= 0; k--) c.push([0, k]); for (r = 1; r <= 5; r++) c.push([r, 0]);
  for (k = 1; k <= 5; k++) c.push([5, k]); for (r = 4; r >= 1; r--) c.push([r, 5]); for (k = 4; k >= 1; k--) c.push([1, k]); for (r = 2; r <= 4; r++) c.push([r, 1]); return c; })();
function cellsHTML(){ var h = "";
  COORD.forEach(function(rc, n){ var i = SQ[n], s = i !== undefined ? stops[i] : null, cls = "cell c" + (1 + n % 3), inner = '<span class="n">' + n + "</span>";
    if (n === 0){ cls = "cell start"; inner = '<span class="si">Start</span>'; }
    if (s){ cls = "cell special"; inner = '<span class="si" aria-hidden="true">' + s.icon + "</span>"; }
    var tag = s ? "button" : "div", attr = s ? ' type="button" data-i="' + i + '" aria-label="Challenge square ' + n + ": " + esc(s.title) + '"' : "";
    h += "<" + tag + ' class="' + cls + '" style="grid-row:' + (rc[0] + 1) + ";grid-column:" + (rc[1] + 1) + '" data-n="' + n + '"' + attr + ">" + inner + '<span class="toks"></span></' + tag + ">"; });
  return h + '<div class="heart" data-n="' + END + '"><span class="hl">Heart of the jungle</span><span class="hc">' + L.code.split("").map(function(){ return "<i>?</i>"; }).join("") + '</span><span class="toks"></span></div>'; }
function placeTokens(){ var b = $("#board"); if (!b) return; $$(".toks", b).forEach(function(t){ t.innerHTML = ""; });
  st.teams.forEach(function(t, k){ var c = $('[data-n="' + Math.min(t.pos, END) + '"] .toks', b);
    if (c) c.insertAdjacentHTML("beforeend", '<span class="tm' + (k === st.turn && !st.over ? " now" : "") + '" style="--c:' + T(t).c + '" title="' + esc(t.name) + '">' + T(t).e + "</span>"); }); }
function dieFace(n){ var onv = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n] || [];
  return [0,1,2,3,4,5,6,7,8].map(function(k){ return '<i style="visibility:' + (onv.indexOf(k) > -1 ? "visible" : "hidden") + '"></i>'; }).join(""); }
function side(){ var t = cur(), s = onStop(t), nx = nextStopFor(t), html = '<div class="turn" style="--c:' + T(t).c + '"><div class="e" aria-hidden="true">' + T(t).e + '</div><div class="who">' + esc(t.name) + '</div><div class="sm" style="color:#cfe0b8">' + (t.at ? "Finished!" : "It’s your turn") + "</div></div>" +
    '<div class="die" id="die" aria-hidden="true">' + dieFace(st.last || 1) + "</div>";
  if (s) html += '<button class="btn orchid" id="ask" style="width:100%">Answer the challenge</button>';
  else html += '<button class="btn gold" id="roll" style="width:100%"' + (busy ? " disabled" : "") + ">Roll the die</button>";
  html += '<p class="next">' + (nx ? "Next challenge: <b>" + nx.icon + " square " + nx.sq + "</b>" : "All eight letters! Roll to reach the heart.") + "</p>";
  html += '<ul class="teams">' + st.teams.map(function(x, k){ return '<li class="' + (k === st.turn ? "now" : "") + '" style="--c:' + T(x).c + '"><span aria-hidden="true">' + T(x).e + "</span><span>" + esc(x.name) + "</span><span>" + (x.at ? "🏁 #" + x.at : "sq. " + x.pos) + '</span><span class="ltrs">' + stops.map(function(s2, i){ var g = x.done[s2.id]; return '<i class="' + (g ? "got" : "") + '">' + (g ? L.code[i] : "") + "</i>"; }).join("") + "</span></li>"; }).join("") + "</ul>";
  html += '<ul class="log" aria-live="polite">' + st.log.slice(0, 5).map(function(l){ return "<li>" + l + "</li>"; }).join("") + "</ul>";
  html += '<p class="keys">Keys: space = roll, 1/2/3 = answer, Enter = continue</p>';
  if (st.arrive.length && !st.over) html += '<div class="btns"><button class="btn ghost" id="res">See results</button></div>';
  return html; }
function paintSide(){ var sd = $("#side"); if (!sd) return; sd.innerHTML = side(); on("roll", roll); on("ask", function(){ ask(); }); on("res", results); placeTokens(); }
function board(){ view = "board"; if (!st) return setup();
  show('<div class="cls-board"><div class="board" id="board" role="group" aria-label="Game board">' + cellsHTML() + '</div><div class="side" id="side"></div></div>', function(){
    paintSide(); $$("#board .cell.special").forEach(function(c){ c.onclick = function(){ notes(+c.dataset.i); }; });
    if (st.q) ask(true); }, "boardscr"); }
function walk(t, to, done){ var step = function(){ if (t.pos === to){ done(); return; } t.pos += to > t.pos ? 1 : -1; placeTokens(); sStep(); setTimeout(step, RM ? 0 : 190); }; step(); }
function roll(){ var t = cur(); if (busy || onStop(t) || t.at || st.q) return; busy = true;
  var r = rnd(6), d = $("#die"); st.last = r; st.rolls++; if (d){ d.innerHTML = dieFace(r); d.classList.remove("roll"); void d.offsetWidth; d.classList.add("roll"); }
  var nx = nextStopFor(t), to = Math.min(t.pos + r, nx ? nx.sq : END, END); paintSide();
  setTimeout(function(){ walk(t, to, function(){ busy = false;
    if (t.pos >= END){ st.arrive.push(st.turn); t.at = st.arrive.length; addLog(T(t).e + " " + esc(t.name) + " reached the heart!"); save(); paintSide(); return heart(t); }
    var s = onStop(t);
    addLog(T(t).e + " " + esc(t.name) + " rolled " + r + (s ? " and landed on a challenge." : " and moved to square " + to + "."));
    save(); paintSide();
    if (s) setTimeout(function(){ ask(); }, RM ? 0 : 500); else setTimeout(nextTurn, RM ? 0 : 700); }); }, RM ? 0 : 450); }
function nextTurn(){ if (st.teams.every(function(t){ return t.at; })) return results();
  do { st.turn = (st.turn + 1) % 4; } while (cur().at); save(); paintSide(); }

/* ---------- question card ---------- */
function pick(t, s){ var used = t.asked[s.id] || [], pool = s.bank.map(function(_, k){ return k; }).filter(function(k){ return used.indexOf(k) < 0; });
  if (!pool.length){ used = []; pool = s.bank.map(function(_, k){ return k; }); } var q = pool[Math.floor(Math.random() * pool.length)];
  t.asked[s.id] = used.concat([q]); return q; }
function passageText(id){ var box = document.createElement("div"), s; for (var i = 0; i < stops.length; i++){ box.innerHTML = stops[i].tpl.innerHTML; var el = box.querySelector("#" + id); if (el){ s = el; break; } }
  if (!s) return ""; if (s.tagName === "TR") return $$("td", s).map(function(td){ return td.textContent; }).join(" · "); return s.innerHTML; }
function ask(resume){ var t = cur(), s = onStop(t); if (!s){ st.q = null; save(); return; }
  if (!st.q || st.q.team !== st.turn || st.q.sid !== s.id) st.q = {team: st.turn, sid: s.id, q: pick(t, s), order: null};
  var b = s.bank[st.q.q]; if (!st.q.order) st.q.order = shuffle([b[1]].concat(b[2])); save();
  var card = $("#card");
  card.innerHTML = '<div class="qcard" role="dialog" aria-modal="true" aria-labelledby="qh"><div class="in" style="--c:' + T(t).c + '"><div class="top"><span class="tname">' + T(t).e + " " + esc(t.name) + "</span><span>" + s.icon + " Square " + s.sq + " · " + s.title + "</span></div>" +
    '<h2 id="qh">' + b[0] + '</h2><div class="opts">' + st.q.order.map(function(o, k){ return '<button type="button" class="opt" data-k="' + k + '"><b>' + (k + 1) + "</b>" + o + "</button>"; }).join("") + '</div><div class="res" id="qres"></div></div></div>';
  $$(".opt", card).forEach(function(btn){ btn.onclick = function(){ answer(+btn.dataset.k); }; });
  var f = $(".opt", card); if (f) f.focus(); }
function answer(k){ var t = cur(), s = onStop(t); if (!s || !st.q || st.q.done) return;
  var b = s.bank[st.q.q], choice = st.q.order[k], ok = choice === b[1], card = $("#card");
  $$(".opt", card).forEach(function(x, j){ x.disabled = true; if (st.q.order[j] === b[1]) x.classList.add("right"); else if (j === k) x.classList.add("wrong"); });
  st.q.done = true; var res = $("#qres");
  if (ok){ sGood(); t.done[s.id] = 1; t.right++; addLog(T(t).e + " " + esc(t.name) + " won the letter " + L.code[s.i] + "!");
    res.innerHTML = '<p class="big2">✓ Correct! Letter <span style="color:#a63d7e">' + L.code[s.i] + "</span></p>" + '<div class="btns"><button class="btn" id="qnext" data-focus>Next team</button></div>'; }
  else { sBad(); t.wrong++; var back = Math.max(0, s.sq - 3); st.q.prev = t.pos; t.pos = back; addLog(T(t).e + " " + esc(t.name) + " slid back to square " + back + ".");
    res.innerHTML = '<p class="big2">✗ Not quite. Slide back 3 squares!</p><p>The answer is <b>' + b[1] + '</b>. From the field notes:</p><div class="passage">' + passageText(b[3]) + "</div>" +
      '<div class="btns"><button class="btn" id="qnext" data-focus>Next team</button><button class="btn ghost2" id="qfix">Teacher: count it as correct</button></div>'; }
  save(); paintSide();
  on("qnext", closeQ); on("qfix", function(){ t.wrong--; t.right++; t.done[s.id] = 1; t.pos = s.sq; addLog("Teacher counted " + esc(t.name) + "’s answer as correct."); save(); closeQ(); });
  var n = $("#qnext"); if (n) n.focus(); }
function closeQ(){ st.q = null; save(); $("#card").innerHTML = ""; paintSide(); nextTurn(); }

/* ---------- heart, results ---------- */
function heart(t){ if (st.arrive.length > 1){ sWin(); addLog(esc(t.name) + " finished in place " + t.at + "."); save(); paintSide(); setTimeout(nextTurn, 900); return; }
  $("#card").innerHTML = '<div class="qcard" role="dialog" aria-modal="true" aria-labelledby="hh"><div class="in" style="--c:' + T(t).c + ';text-align:center"><div class="bossrow" style="margin:0 auto">' + window.SVGS.hunter + '<div class="bubble" style="text-align:left"><span class="who">Professor Purity, the Hunter of the One True Style</span>Halt, ' + esc(t.name) + '! Only one style may grow in my jungle. You will never say the password!</div></div>' +
    '<h2 id="hh">' + T(t).e + " " + esc(t.name) + ', shout the password!</h2><div class="code">' + L.code.split("").map(function(c){ return "<span>" + c + "</span>"; }).join("") + '</div><form class="pwf" onsubmit="return false"><input id="pw" autocomplete="off" aria-label="Password" placeholder="Password"><button class="btn orchid" id="pwgo">Say it!</button></form><p class="res" id="pwfb"></p></div></div>';
  var f = function(){ if ($("#pw").value.trim().toUpperCase() === L.code){ sWin(); st.pw = true; save();
      $("#pwfb").innerHTML = '<span class="big2">PASTICHE! 🎉</span><br>The one true style crumbles into polka dots, neon, and soup-can labels. ' + esc(t.name) + ' win!<div class="btns" style="justify-content:center"><button class="btn" id="keep">Keep playing for 2nd place</button><button class="btn" id="res2">See results</button></div>';
      on("keep", function(){ $("#card").innerHTML = ""; nextTurn(); }); on("res2", function(){ $("#card").innerHTML = ""; results(); }); }
    else { sBad(); $("#pwfb").textContent = "Professor Purity laughs. Read the letters and try again!"; } };
  on("pwgo", f); $("#pw").focus(); }
function results(){ view = "results"; st.over = true; save();
  var order = st.teams.slice().sort(function(a, b){ if (a.at && b.at) return a.at - b.at; if (a.at) return -1; if (b.at) return 1; var d = Object.keys(b.done).length - Object.keys(a.done).length; return d || b.pos - a.pos; });
  show('<h1 class="big">Results</h1><div class="program"><div class="tablewrap"><table class="results"><thead><tr><th>Place</th><th>Team</th><th>Letters</th><th>Right answers</th><th>Wrong answers</th><th>Square</th></tr></thead><tbody>' +
    order.map(function(t, k){ return "<tr><td>" + (["🥇","🥈","🥉","🏅"][k]) + " " + (k + 1) + "</td><td>" + T(t).e + " " + esc(t.name) + "</td><td>" + Object.keys(t.done).length + " of 8</td><td>" + t.right + "</td><td>" + t.wrong + "</td><td>" + (t.at ? "Heart" : t.pos) + "</td></tr>"; }).join("") +
    '</tbody></table></div><p class="sm">Next step: each student plays the solo game and takes the Canvas quiz “' + L.final + '.”</p></div><div class="btns"><button class="btn gold" id="back">Back to the board</button><button class="btn ghost" id="again">New game</button></div>',
    function(){ on("back", function(){ st.over = false; board(); }); on("again", newGame); }, "center"); }
function newGame(){ if (st && !confirm("Start a new game? This clears the current board.")) return; try { localStorage.removeItem(KEY); } catch(e){} st = null; setup(); }

/* ---------- field notes reader (for teaching before or during the game) ---------- */
function clean(html){ var box = document.createElement("div"); box.innerHTML = html; $$(".tryit,.discuss,.lab,.heard", box).forEach(function(x){ x.remove(); }); return box.innerHTML; }
function notes(i){ view = "notes"; i = i || 0; var s = stops[i];
  show('<div class="notesnav">' + stops.map(function(x, k){ return '<button type="button" class="btn' + (k === i ? " on" : "") + '" data-k="' + k + '">' + x.icon + " " + x.sq + "</button>"; }).join("") + '</div><article class="program"><div class="ptop"><span>' + s.icon + " Square " + s.sq + " · " + s.place + "</span><span>Field notes " + (i + 1) + " of 8</span></div><h2>" + s.title + "</h2>" + clean(s.tpl.innerHTML) + '</article><div class="btns"><button class="btn gold" id="back">Back to the board</button></div>',
    function(){ $$(".notesnav .btn", screen).forEach(function(b){ b.onclick = function(){ notes(+b.dataset.k); }; }); on("back", board);
      $$(".explorer", screen).forEach(function(ex){ var cards = $$(".card", ex), j = 0, prev = $(".prev", ex), next = $(".next", ex), cnt = $(".count", ex);
        function sh(){ cards.forEach(function(c, k){ c.classList.toggle("on", k === j); }); cnt.textContent = (j + 1) + " of " + cards.length; prev.disabled = j === 0; next.disabled = j === cards.length - 1; }
        prev.onclick = function(){ if (j > 0){ j--; sh(); } }; next.onclick = function(){ if (j < cards.length - 1){ j++; sh(); } }; sh(); }); }, "notes"); }
function wordsScreen(){ view = "words"; show('<div class="program"><h2>🔤 Words to Know</h2><dl class="words">' + $("#tpl-words").innerHTML + '</dl></div><div class="btns"><button class="btn gold" id="back">Back to the board</button></div>', function(){ on("back", board); }); }
var openFact = null;
document.addEventListener("click", function(e){ var h = e.target.closest(".hot");
  if (openFact && (!h || openFact.dataset.for !== h.style.cssText)){ openFact.remove(); openFact = null; }
  if (h){ e.stopPropagation(); if (openFact) return; var f = document.createElement("div"); f.className = "hotfact"; f.textContent = h.dataset.fact; f.dataset.for = h.style.cssText; h.parentNode.appendChild(f);
    var x = parseFloat(h.style.left), y = parseFloat(h.style.top); f.style.left = Math.min(Math.max(x - 20, 2), 40) + "%"; if (y > 60) f.style.bottom = (100 - y + 6) + "%"; else f.style.top = (y + 6) + "%"; openFact = f; } });

/* ---------- keys and buttons ---------- */
document.addEventListener("keydown", function(e){ if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if ($("#card .opt:not([disabled])") && /^[1-3]$/.test(e.key)){ answer(+e.key - 1); e.preventDefault(); return; }
  if (e.key === "Enter" && $("#qnext")){ $("#qnext").click(); e.preventDefault(); return; }
  if (e.key === " " && view === "board" && !$("#card").innerHTML){ var r = $("#roll"), a = $("#ask"); if (r) roll(); else if (a) ask(); e.preventDefault(); } });
$("#boardBtn").onclick = function(){ st ? board() : setup(); }; $("#notesBtn").onclick = function(){ notes(0); }; $("#wordsBtn").onclick = wordsScreen; $("#newBtn").onclick = newGame;
window.__cls = {st: function(){ return st; }, roll: roll, answer: answer};
function padTop(){ var tb = $(".topbar"); $(".wrap2").style.paddingTop = (tb.offsetHeight + 8) + "px"; } padTop(); window.addEventListener("resize", padTop);
setup();
})();
</script>
</body></html>
